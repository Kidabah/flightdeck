<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Amy — Flightdeck</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #020617;
      --panel: rgba(2, 12, 28, 0.88);
      --ink: #e2e8f0;
      --muted: #94a3b8;
      --accent: #22d3ee;
      --line: rgba(34, 211, 238, 0.28);
      --glow: 0 0 22px rgba(34, 211, 238, 0.35);
      --ok: #4ade80;
      --warn: #fbbf24;
      --hud-w: 260px;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; height: 100%; overflow: hidden; color: var(--ink);
      background:
        radial-gradient(1100px 650px at 72% 18%, rgba(8, 47, 73, 0.5), transparent 60%),
        radial-gradient(800px 480px at 18% 82%, rgba(14, 116, 144, 0.18), transparent 55%),
        var(--bg);
      font-family: "IBM Plex Sans", system-ui, sans-serif;
    }
    #graph { position: absolute; inset: 0; }
    #stars { position: absolute; inset: 0; pointer-events: none; opacity: 0.7; }
    #vignette {
      position: absolute; inset: 0; pointer-events: none; z-index: 2;
      background: radial-gradient(ellipse at center, transparent 42%, rgba(2, 6, 23, 0.78) 100%);
    }

    #brand {
      position: absolute; top: 16px; left: 16px; z-index: 8;
      padding: 10px 14px; border-radius: 14px;
      background: var(--panel); border: 1px solid var(--line);
      backdrop-filter: blur(12px); box-shadow: var(--glow);
    }
    #brand strong {
      display: block; font-family: Orbitron, sans-serif; letter-spacing: 0.16em;
      font-size: 0.72rem; color: var(--accent);
    }
    #brand span { font-size: 0.82rem; color: var(--muted); }

    #topbar {
      position: absolute; top: 16px; left: 50%; transform: translateX(-50%);
      z-index: 8; width: min(380px, calc(100vw - 340px));
    }
    #search {
      width: 100%; border-radius: 999px; border: 1px solid var(--line);
      background: rgba(2, 12, 28, 0.8); color: var(--ink);
      padding: 10px 18px; font: inherit; outline: none;
      box-shadow: var(--glow); backdrop-filter: blur(12px);
    }
    #search::placeholder { color: #67e8f87a; }
    #search:focus { border-color: var(--accent); }

    #share-dot {
      display: none; position: absolute; top: 16px; left: 170px; z-index: 8;
      background: rgba(127, 29, 29, 0.92); color: #fecaca; border: 1px solid #ef4444;
      border-radius: 999px; padding: 8px 12px; font-size: 0.72rem; font-weight: 800; letter-spacing: 0.06em;
    }

    /* Right HUD column — never overlaps note card */
    #hud {
      position: absolute; top: 16px; right: 16px; width: var(--hud-w); z-index: 9;
      display: flex; flex-direction: column; gap: 10px; align-items: stretch;
    }
    .face-card {
      background: var(--panel); border: 1px solid var(--line); border-radius: 18px;
      padding: 28px 18px 12px; backdrop-filter: blur(12px); box-shadow: var(--glow);
      display: grid; justify-items: center; gap: 8px;
      overflow: visible;
    }
    .face-wrap {
      position: relative;
      width: 168px; height: 168px;
      display: grid; place-items: center;
    }
    .face {
      width: 168px; height: 168px; position: relative; z-index: 2;
      border-radius: 50%;
      overflow: hidden;
      border: 2px solid rgba(103, 232, 248, 0.75);
      box-shadow: 0 0 0 3px rgba(8, 145, 178, 0.25), 0 0 24px rgba(34, 211, 238, 0.45);
      background: #020617;
      filter: drop-shadow(0 0 14px rgba(34, 211, 238, 0.35));
    }
    .face video {
      width: 100%; height: 100%; object-fit: cover; display: block;
      transform: scale(1.02);
    }
    .hud-rings {
      pointer-events: none; position: absolute; inset: -28px; z-index: 1;
      opacity: 0; transition: opacity 0.2s ease;
    }
    .face-wrap[data-mode="speaking"] .hud-rings,
    .face-wrap[data-mode="listening"] .hud-rings { opacity: 1; }
    .hud-ring, .hud-arc {
      position: absolute; inset: 0; border-radius: 50%;
      border: 1.5px solid transparent;
    }
    .hud-ring.r1 {
      inset: 10px;
      border-color: rgba(34, 211, 238, 0.55);
      box-shadow: 0 0 12px rgba(34, 211, 238, 0.25);
    }
    .hud-ring.r2 {
      inset: 0;
      border-color: rgba(103, 232, 248, 0.35);
      border-style: dashed;
    }
    .hud-ring.r3 {
      inset: -12px;
      border-color: rgba(34, 211, 238, 0.22);
    }
    .hud-arc.a1 {
      inset: 4px;
      border-top-color: #67e8f8;
      border-right-color: transparent;
      border-bottom-color: transparent;
      border-left-color: rgba(34, 211, 238, 0.15);
      border-width: 2px;
    }
    .hud-arc.a2 {
      inset: -6px;
      border-bottom-color: #22d3ee;
      border-left-color: transparent;
      border-top-color: transparent;
      border-right-color: rgba(103, 232, 248, 0.2);
      border-width: 2px;
    }
    .hud-ticks {
      position: absolute; inset: -4px; border-radius: 50%;
    }
    .hud-ticks::before, .hud-ticks::after {
      content: ""; position: absolute; left: 50%; width: 2px; height: 8px;
      margin-left: -1px; background: #67e8f8;
      box-shadow: 0 0 8px rgba(34, 211, 238, 0.8);
    }
    .hud-ticks::before { top: 0; }
    .hud-ticks::after { bottom: 0; }
    .face-wrap[data-mode="speaking"] .hud-ring.r1 { animation: jarvis-pulse 0.7s ease-in-out infinite; }
    .face-wrap[data-mode="speaking"] .hud-ring.r2 { animation: jarvis-pulse 1.1s ease-in-out infinite reverse; }
    .face-wrap[data-mode="speaking"] .hud-ring.r3 { animation: jarvis-pulse 0.95s ease-in-out infinite; }
    .face-wrap[data-mode="speaking"] .hud-arc.a1,
    .face-wrap[data-mode="speaking"] .hud-arc.a2 { animation: jarvis-pulse 0.8s ease-in-out infinite; }
    .face-wrap[data-mode="speaking"] .hud-ticks { animation: jarvis-vibrate 0.18s linear infinite; }
    .face-wrap[data-mode="listening"] .hud-ring.r1 {
      border-color: rgba(74, 222, 128, 0.55);
      animation: jarvis-pulse 1.6s ease-in-out infinite;
    }
    .face-wrap[data-mode="listening"] .hud-ring.r2 {
      border-color: rgba(74, 222, 128, 0.3);
      animation: jarvis-pulse 2.2s ease-in-out infinite reverse;
    }
    .face-wrap[data-mode="listening"] .hud-arc.a1,
    .face-wrap[data-mode="listening"] .hud-arc.a2 { border-top-color: #4ade80; border-bottom-color: #4ade80; }
    .face[data-mode="listening"] {
      border-color: #4ade80;
      box-shadow: 0 0 0 3px rgba(74, 222, 128, 0.25), 0 0 28px rgba(74, 222, 128, 0.45);
    }
    .face[data-mode="speaking"] {
      border-color: #22d3ee;
      box-shadow: 0 0 0 3px rgba(34, 211, 238, 0.35), 0 0 32px rgba(34, 211, 238, 0.55);
    }
    .face[data-mode="thinking"] {
      border-color: #fbbf24;
      box-shadow: 0 0 0 3px rgba(251, 191, 36, 0.25), 0 0 28px rgba(251, 191, 36, 0.35);
    }
    .face[data-mode="thinking"] video { filter: saturate(0.85) brightness(0.92); }
    .face-wrap[data-mode="asleep"] .hud-rings { opacity: 0 !important; }
    .face[data-mode="asleep"] {
      border-color: rgba(51, 65, 85, 0.7);
      box-shadow: none;
      filter: grayscale(0.85) brightness(0.28);
      transition: filter 0.6s ease, border-color 0.6s ease, box-shadow 0.6s ease;
    }
    .face[data-mode="asleep"] video { opacity: 0.35; }
    .face-wrap[data-mode="asleep"] + .face-name,
    .face-card:has(.face-wrap[data-mode="asleep"]) .face-name {
      color: #475569; text-shadow: none;
    }
    .face-card:has(.face-wrap[data-mode="asleep"]) .face-state { color: #334155; }
    @keyframes jarvis-pulse {
      0%,100% { transform: scale(1); opacity: 0.85; }
      50% { transform: scale(1.03); opacity: 1; }
    }
    @keyframes jarvis-vibrate {
      0% { transform: scale(1); opacity: 0.9; }
      50% { transform: scale(1.02); opacity: 1; }
      100% { transform: scale(1); opacity: 0.9; }
    }
    .face-name {
      font-family: Orbitron, sans-serif; letter-spacing: 0.22em; font-size: 0.95rem;
      color: var(--accent); text-shadow: 0 0 10px rgba(34, 211, 238, 0.7);
    }
    .face-state { font-size: 0.68rem; letter-spacing: 0.12em; color: var(--muted); text-transform: uppercase; }

    .chips { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; }
    .chip {
      border-radius: 999px; border: 1px solid var(--line); background: rgba(2, 12, 28, 0.9);
      color: var(--accent); padding: 6px 10px; font-size: 0.65rem; font-weight: 700; letter-spacing: 0.05em;
    }
    .chip.live { border-color: var(--accent); box-shadow: var(--glow); background: rgba(8, 145, 178, 0.28); }
    .chip.model { color: #e0f2fe; }

    .modes, .organs {
      display: grid; gap: 6px; width: 100%;
    }
    .modes { grid-template-columns: repeat(3, 1fr); }
    .organs { grid-template-columns: repeat(2, 1fr); }
    .modes button, .organs button {
      border: 1px solid var(--line); background: rgba(2, 12, 28, 0.8); color: #94a3b8;
      border-radius: 10px; padding: 8px 4px; font: inherit; font-size: 0.65rem; font-weight: 700;
      letter-spacing: 0.08em; cursor: pointer;
    }
    .modes button.active, .organs button.active {
      color: var(--accent); border-color: var(--accent); box-shadow: var(--glow);
      background: rgba(8, 145, 178, 0.22);
    }
    .organs button:disabled { opacity: 0.4; cursor: default; }

    /* Note panel — LEFT side, clear of HUD */
    #side {
      position: absolute; top: 88px; left: 16px; width: min(320px, calc(100vw - var(--hud-w) - 48px));
      z-index: 8; max-height: calc(100vh - 220px); overflow: auto;
      background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
      padding: 12px 14px; backdrop-filter: blur(12px); display: none; box-shadow: var(--glow);
    }
    #side h2 { margin: 0 0 6px; font-size: 0.98rem; font-family: Orbitron, sans-serif; letter-spacing: 0.04em; }
    #side .group { color: var(--accent); font-size: 0.68rem; letter-spacing: 0.1em; text-transform: uppercase; }
    #side p { margin: 8px 0 0; color: var(--muted); font-size: 0.84rem; line-height: 1.4; white-space: pre-wrap; }
    #side-close {
      float: right; border: 0; background: transparent; color: var(--muted); cursor: pointer; font-size: 1rem;
    }

    #dock {
      position: absolute; left: 50%; bottom: 18px; transform: translateX(-50%);
      width: min(720px, calc(100vw - var(--hud-w) - 40px)); z-index: 8; display: grid; gap: 8px;
    }
    #secure-hint {
      display: none; text-align: center; font-size: 0.72rem; color: #fca5a5;
      background: rgba(127, 29, 29, 0.35); border: 1px solid #ef4444; border-radius: 10px; padding: 8px 10px;
    }
    #secure-hint a { color: #fecaca; }
    #status-line {
      text-align: center; font-size: 0.7rem; letter-spacing: 0.14em; text-transform: uppercase;
      color: #64748b; min-height: 1em;
    }
    #status-line[data-mode="listening"] { color: var(--ok); }
    #status-line[data-mode="thinking"] { color: var(--warn); }
    #status-line[data-mode="speaking"] { color: var(--accent); }
    #answer {
      background: rgba(2, 12, 28, 0.9); border: 1px solid var(--line); border-radius: 16px;
      padding: 12px 16px; min-height: 2.8em; font-size: 0.95rem; line-height: 1.45;
      box-shadow: var(--glow); backdrop-filter: blur(12px);
    }
    .row { display: flex; gap: 8px; align-items: stretch; }
    #chat-input {
      flex: 1; border-radius: 14px; border: 1px solid var(--line); background: rgba(2, 12, 28, 0.92);
      color: var(--ink); padding: 12px 14px; font: inherit; outline: none;
    }
    #chat-input:focus { border-color: var(--accent); box-shadow: var(--glow); }
    button.tool {
      border: 1px solid var(--line); background: rgba(2, 12, 28, 0.92); color: var(--ink);
      border-radius: 14px; padding: 0 14px; font: inherit; font-size: 0.75rem; font-weight: 800;
      letter-spacing: 0.06em; cursor: pointer; white-space: nowrap;
    }
    button.tool:hover { border-color: var(--accent); color: var(--accent); }
    button.tool.active { background: rgba(8, 145, 178, 0.28); border-color: var(--accent); color: var(--accent); box-shadow: var(--glow); }
    #tray { display: flex; justify-content: center; gap: 10px; }
    #tray button {
      width: 38px; height: 38px; border-radius: 50%; border: 1px solid var(--line);
      background: rgba(2, 12, 28, 0.88); color: var(--accent); cursor: pointer; box-shadow: var(--glow); font-size: 0.95rem;
    }
    #drops {
      display: none; flex-wrap: wrap; gap: 6px;
    }
    #drops.show { display: flex; }
    .drop-chip {
      display: inline-flex; align-items: center; gap: 6px; max-width: 100%;
      border: 1px solid var(--line); background: rgba(8, 47, 73, 0.65);
      color: var(--ink); border-radius: 999px; padding: 4px 10px; font-size: 0.72rem;
    }
    .drop-chip button {
      border: 0; background: transparent; color: var(--muted); cursor: pointer; font-size: 0.85rem; padding: 0;
    }
    #drop-overlay {
      display: none; position: absolute; inset: 0; z-index: 6;
      border: 2px dashed var(--accent); border-radius: 18px;
      background: rgba(2, 12, 28, 0.88); color: var(--accent);
      align-items: center; justify-content: center; text-align: center;
      font-family: Orbitron, sans-serif; letter-spacing: 0.12em; font-size: 0.78rem;
      pointer-events: none;
    }
    #dock.dragover #drop-overlay { display: flex; }
  </style>
  <script src="//unpkg.com/3d-force-graph"></script>
  <script src="/graph-data.js"></script>
</head>
<body>
  <canvas id="stars"></canvas>
  <div id="graph"></div>
  <div id="vignette"></div>

  <div id="brand"><strong>FLIGHTDECK · AMY</strong><span id="brand-sub">booting…</span></div>
  <div id="share-dot">SCREEN SHARE LIVE</div>
  <div id="topbar"><input id="search" type="search" placeholder="Search notes / printers…" autocomplete="off" /></div>

  <aside id="hud">
    <div class="face-card">
      <div class="face-wrap" id="amy-face-wrap" data-mode="idle">
        <div class="hud-rings" aria-hidden="true">
          <span class="hud-ring r3"></span>
          <span class="hud-ring r2"></span>
          <span class="hud-ring r1"></span>
          <span class="hud-arc a1"></span>
          <span class="hud-arc a2"></span>
          <span class="hud-ticks"></span>
        </div>
        <div class="face" id="amy-face" data-mode="idle" aria-label="Amy">
          <video id="amy-face-video" muted playsinline preload="auto" poster="">
            <source src="/amy-face.webm" type="video/webm" />
            <source src="/amy-face.mp4" type="video/mp4" />
          </video>
        </div>
      </div>
      <div class="face-name">AMY</div>
      <div class="face-state" id="face-state">STANDBY</div>
      <div class="chips">
        <span class="chip" id="speak-chip">● IDLE</span>
        <span class="chip model" id="model-chip">MODEL</span>
      </div>
    </div>
    <div class="modes" role="tablist" aria-label="Galaxy view">
      <button type="button" class="active" data-view="ring">RING</button>
      <button type="button" data-view="cube">CUBE</button>
      <button type="button" data-view="face">ORBIT</button>
    </div>
    <div class="organs" aria-label="Organs">
      <button type="button" id="eyes-btn">EYES</button>
      <button type="button" id="watch-btn" disabled title="Coming soon">WATCH</button>
      <button type="button" id="holo-btn" disabled title="Coming soon">HOLO</button>
      <button type="button" id="focus-btn" disabled title="Coming soon">FOCUS</button>
    </div>
  </aside>

  <aside id="side">
    <button type="button" id="side-close" aria-label="Close note">×</button>
    <div class="group" id="side-group"></div>
    <h2 id="side-title"></h2>
    <p id="side-body"></p>
  </aside>

  <div id="dock">
    <div id="drop-overlay">DROP FILES FOR AMY</div>
    <div id="secure-hint">Mic needs HTTPS. Open <a id="https-link" href="#">the secure Amy URL</a> — Chrome treats plain HTTP like speakers-only.</div>
    <div id="status-line" data-mode="idle">Ready</div>
    <div id="answer"></div>
    <div id="drops" aria-live="polite"></div>
    <div class="row">
      <input id="chat-input" type="text" placeholder="Talk to Amy… (or drop files)" autocomplete="off" />
      <input id="file-input" type="file" multiple hidden accept="image/*,.txt,.md,.json,.csv,.py,.js,.ts,.html,.css,.log,.gcode,.xml,.yml,.yaml,.svg" />
      <button class="tool" id="file-btn" type="button" title="Attach files">FILE</button>
      <button class="tool" id="mic-btn" type="button" title="Microphone">MIC</button>
      <button class="tool" id="stop-btn" type="button" title="Stop Amy talking">STOP</button>
      <button class="tool" id="send-btn" type="button">ASK</button>
    </div>
    <div id="tray">
      <button type="button" id="tray-mic" title="Mic">🎙</button>
      <button type="button" id="tray-eyes" title="Eyes / screen">👁</button>
      <button type="button" id="tray-file" title="Drop files">📎</button>
      <button type="button" id="tray-refresh" title="Refresh graph">↻</button>
    </div>
  </div>

<script>
const FINISH_MS = 1400;
const IDLE_NUDGE_MS = 3 * 60 * 1000;   // whistle / cheeky line
const IDLE_SLEEP_MS = 6 * 60 * 1000;   // go dark
const MUTE = new URLSearchParams(location.search).has('mute');
const IS_SECURE = window.isSecureContext;
// WebView2 / embedded shells often break SpeechRecognition even after "Allow".
const IN_WEBVIEW = /\bwv\b/i.test(navigator.userAgent)
  || (/Edg\//.test(navigator.userAgent) && !window.chrome?.runtime && navigator.userAgentData?.brands?.some(b => /WebView/i.test(b.brand)));


const statusEl = document.getElementById('status-line');
const answerEl = document.getElementById('answer');
const inputEl = document.getElementById('chat-input');
const micBtn = document.getElementById('mic-btn');
const stopBtn = document.getElementById('stop-btn');
const sendBtn = document.getElementById('send-btn');
const eyesBtn = document.getElementById('eyes-btn');
const side = document.getElementById('side');
const shareDot = document.getElementById('share-dot');
const brandSub = document.getElementById('brand-sub');
const amyFace = document.getElementById('amy-face');
const amyFaceWrap = document.getElementById('amy-face-wrap');
const faceState = document.getElementById('face-state');
const speakChip = document.getElementById('speak-chip');
const modelChip = document.getElementById('model-chip');
const searchEl = document.getElementById('search');
const secureHint = document.getElementById('secure-hint');
const dockEl = document.getElementById('dock');
const dropsEl = document.getElementById('drops');
const fileInput = document.getElementById('file-input');
const fileBtn = document.getElementById('file-btn');

let pendingFiles = []; // {name, media_type, data}
let asleep = false;
let idleTimer = null;
let nudgedIdle = false;
let audioCtx = null;

const NUDGE_LINES = [
  "Still with me, Chris? I can wait… or I can whistle.",
  "Taking your time, Kidabah. I'll just hum to myself.",
  "Hellooo? Amy to Chris — I'm getting lonely over here.",
  "If you're stuck, say wake up later. I'll nap pretty.",
];

let graph = null;
let shareStream = null;
let shareVideo = null;
let unlockedAudio = false;
let viewMode = 'ring';
let listening = false;
let wantListen = false;
let isSpeaking = false;
let micMutedUntil = 0;
let recognition = null;
let pending = '';
let finishTimer = null;
let chatAbort = null;

function micIsDeaf() {
  // Echo cooldown after she finishes — interrupts are handled separately while speaking.
  return !isSpeaking && Date.now() < micMutedUntil;
}

function duckMic() {
  clearTimeout(finishTimer);
  finishTimer = null;
  pending = '';
  isSpeaking = true;
  // Keep recognition hot for barge-in ("stop" / "hang on").
  if (wantListen && recognition) {
    try { recognition.start(); } catch (_) {}
  }
}

function unduckMic() {
  isSpeaking = false;
  // Let speaker echo die before normal listening resumes.
  micMutedUntil = Date.now() + 900;
  if (wantListen) {
    setStatus('listening', 'Listening');
    setTimeout(() => {
      if (!wantListen || isSpeaking || !recognition) return;
      try { recognition.start(); } catch (_) {}
    }, 950);
  } else if (statusEl.dataset.mode === 'speaking' || statusEl.dataset.mode === 'thinking') {
    setStatus('idle', 'Ready');
  }
}

function isInterrupt(t) {
  const s = String(t || '').trim().toLowerCase().replace(/[.,!?]+$/g, '');
  if (!s) return false;
  if (/^(amy[, ]+)?(please[, ]+)?(stop|wait|quiet|enough|shh+|hush)( it| talking| amy)?$/i.test(s)) return true;
  if (/^(stop|wait|quiet|enough) amy$/i.test(s)) return true;
  if (/^(hang on|hold on)( a (sec|second|minute|moment))?$/i.test(s)) return true;
  if (/^(hang on|hold on|stop|wait)\b/i.test(s) && s.length <= 36) return true;
  return false;
}

function looksLikeInterrupt(t) {
  if (isInterrupt(t)) return true;
  if (!isSpeaking) return false;
  const s = String(t || '').trim().toLowerCase();
  if (!s || s.length > 48) return false;
  return /\b(stop|wait|quiet|enough|shh+|hush|hang on|hold on)\b/i.test(s);
}

function handleInterrupt() {
  clearTimeout(finishTimer);
  finishTimer = null;
  pending = '';
  inputEl.value = '';
  try { chatAbort?.abort(); } catch (_) {}
  chatAbort = null;
  stopSpeaking();
  isSpeaking = false;
  micMutedUntil = Date.now() + 350;
  bumpIdle();
  answerEl.textContent = answerEl.textContent ? `${answerEl.textContent}\n\n(stopped)` : '(stopped)';
  if (wantListen) {
    setStatus('listening', 'Listening — interrupted');
    syncMicUi();
    setTimeout(() => {
      if (!wantListen || isSpeaking || !recognition) return;
      try { recognition.start(); } catch (_) {}
    }, 200);
  } else {
    setStatus('idle', 'Interrupted');
  }
}

function isWakePhrase(t) {
  const s = String(t || '').trim().toLowerCase().replace(/[.,!?]+$/g, '');
  if (!s) return false;
  return /^(wake up( amy)?|amy wake up|hey amy|good morning amy|rise and shine)$/i.test(s)
    || /\bwake up\b.*\bamy\b/i.test(s)
    || /\bamy\b.*\bwake up\b/i.test(s);
}

function isWhistlePhrase(t) {
  const s = String(t || '').trim().toLowerCase().replace(/[.,!?]+$/g, '');
  if (!s) return false;
  return /^(amy[, ]+)?(please[, ]+)?(whistle|sing|give me a whistle|do a whistle|whistle for me|sing for me)(,?\s*please)?$/i.test(s)
    || /^(can you|could you|will you) (please )?(whistle|sing)\b/i.test(s);
}

function doWhistle() {
  unlockedAudio = true;
  if (asleep) wakeAmy('force');
  bumpIdle();
  whistle();
}

function bumpIdle() {
  nudgedIdle = false;
  if (idleTimer) clearTimeout(idleTimer);
  if (asleep) return;
  idleTimer = setTimeout(onIdleNudge, IDLE_NUDGE_MS);
}

async function onIdleNudge() {
  if (asleep || isSpeaking || statusEl.dataset.mode === 'thinking') {
    bumpIdle();
    return;
  }
  if (!nudgedIdle) {
    nudgedIdle = true;
    try {
      whistle();
      if (!MUTE) await speak(NUDGE_LINES[Math.floor(Math.random() * NUDGE_LINES.length)]);
    } catch (_) {}
    idleTimer = setTimeout(enterSleep, IDLE_SLEEP_MS - IDLE_NUDGE_MS);
    return;
  }
  enterSleep();
}

function whistle() {
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    const ctx = audioCtx;
    // Little tune — not a single peep.
    const notes = [
      { f: 784, d: 0.14 },  // G5
      { f: 880, d: 0.14 },  // A5
      { f: 988, d: 0.18 },  // B5
      { f: 880, d: 0.12 },  // A5
      { f: 1175, d: 0.22 }, // D6
      { f: 988, d: 0.14 },  // B5
      { f: 1319, d: 0.32 }, // E6
      { f: 1175, d: 0.18 }, // D6
      { f: 988, d: 0.28 },  // B5
    ];
    let t = ctx.currentTime + 0.02;
    for (const n of notes) {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(n.f, t);
      gain.gain.setValueAtTime(0.0001, t);
      gain.gain.exponentialRampToValueAtTime(0.07, t + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, t + n.d);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(t);
      osc.stop(t + n.d + 0.02);
      t += n.d + 0.04;
    }
  } catch (_) {}
}

function enterSleep() {
  if (asleep) return;
  asleep = true;
  if (idleTimer) clearTimeout(idleTimer);
  idleTimer = null;
  stopSpeaking();
  isSpeaking = false;
  clearTimeout(finishTimer);
  pending = '';
  // Stay mic-armed so "wake up amy" works, but ignore normal chat.
  setStatus('asleep', 'Sleeping — say wake up Amy');
  syncMicUi();
}

function wakeAmy(reason) {
  if (!asleep && reason !== 'force') {
    bumpIdle();
    return;
  }
  asleep = false;
  nudgedIdle = false;
  setStatus(wantListen ? 'listening' : 'idle', wantListen ? 'Listening' : 'Ready');
  bumpIdle();
  if (wantListen && recognition && !listening) {
    try { recognition.start(); } catch (_) {}
  }
  if (reason === 'voice' || reason === 'click') {
    speak("I'm up, Chris. What do you need?");
  }
}

function setStatus(mode, text) {
  statusEl.dataset.mode = mode;
  statusEl.textContent = text;
  amyFace.dataset.mode = mode;
  if (amyFaceWrap) amyFaceWrap.dataset.mode = mode;
  const labels = { idle: 'STANDBY', listening: 'LISTENING', thinking: 'THINKING', speaking: 'TALKING', asleep: 'SLEEPING' };
  faceState.textContent = labels[mode] || 'STANDBY';
  const vid = document.getElementById('amy-face-video');
  if (vid) {
    // Tripo clip is a turntable — keep a still frame so Amy doesn't spin.
    const freeze = () => {
      try {
        if (!Number.isFinite(vid.duration) || vid.duration === 0) return;
        // Pick a flattering mid frame once, then stay put.
        if (vid.dataset.frozen !== '1') {
          vid.currentTime = Math.min(0.35, Math.max(0.05, vid.duration * 0.12));
          vid.dataset.frozen = '1';
        }
        vid.pause();
      } catch (_) {}
    };
    if (vid.readyState >= 1) freeze();
    else vid.addEventListener('loadedmetadata', freeze, { once: true });
    vid.playbackRate = 1;
  }
  if (mode === 'speaking') {
    speakChip.textContent = '● TALKING';
    speakChip.classList.add('live');
  } else if (mode === 'listening') {
    speakChip.textContent = '● LISTENING';
    speakChip.classList.add('live');
  } else if (mode === 'thinking') {
    speakChip.textContent = '● THINKING';
    speakChip.classList.add('live');
  } else if (mode === 'asleep') {
    speakChip.textContent = '● SLEEP';
    speakChip.classList.remove('live');
  } else {
    speakChip.textContent = '● IDLE';
    speakChip.classList.remove('live');
  }
}

let cachedVoice = null;
let cachedVoiceName = '';
let amyAudio = null;
let ttsMode = 'browser'; // 'laura' | 'openai' | 'browser'
let ttsVoiceLabel = 'Laura';

function scoreVoice(v) {
  const name = String(v.name || '');
  const lang = String(v.lang || '');
  let score = 0;
  // Fallback browser voice if ElevenLabs isn't keyed yet.
  if (/en-GB/i.test(lang)) score += 35;
  else if (/en-AU/i.test(lang)) score += 32;
  else if (/en-US/i.test(lang)) score += 20;
  else if (/^en/i.test(lang)) score += 8;
  if (/samantha|moira|hazel|susan|sonia|serena|libby|joanna|ivy/i.test(name)) score += 36;
  if (/catherine|natasha|aria|jenny|sara/i.test(name)) score += 24;
  if (/karen|zira/i.test(name)) score += 12;
  if (/microsoft.*natural|neural|online \(natural\)|google.*female/i.test(name)) score += 20;
  if (/female/i.test(name)) score += 10;
  if (/male|david|mark|ravi|george|thomas|guy|ryan/i.test(name)) score -= 40;
  return score;
}

function pickVoice() {
  const voices = window.speechSynthesis?.getVoices?.() || [];
  if (!voices.length) return null;
  if (cachedVoice && voices.includes(cachedVoice)) return cachedVoice;
  const ranked = [...voices].sort((a, b) => scoreVoice(b) - scoreVoice(a));
  cachedVoice = ranked[0] || null;
  cachedVoiceName = cachedVoice ? cachedVoice.name : '';
  return cachedVoice;
}

function stopSpeaking() {
  try { amyAudio?.pause(); } catch (_) {}
  amyAudio = null;
  window.speechSynthesis?.cancel();
}

function speakBrowser(text) {
  if (!window.speechSynthesis) {
    unduckMic();
    return;
  }
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  const voice = pickVoice();
  if (voice) {
    u.voice = voice;
    u.lang = voice.lang || 'en-GB';
  } else {
    u.lang = 'en-GB';
  }
  u.rate = 0.92;
  u.pitch = 0.82;
  setStatus('speaking', cachedVoiceName ? `Talking · ${cachedVoiceName.split(' - ')[0]}` : 'Talking');
  u.onend = () => unduckMic();
  u.onerror = () => unduckMic();
  window.speechSynthesis.speak(u);
}

async function speakLaura(text) {
  setStatus('speaking', `Talking · ${ttsVoiceLabel}`);
  const r = await fetch('/tts', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ text }),
  });
  if (!r.ok) {
    let detail = `TTS HTTP ${r.status}`;
    try {
      const j = await r.json();
      detail = j.detail || detail;
    } catch (_) {}
    throw new Error(detail);
  }
  const blob = await r.blob();
  const url = URL.createObjectURL(blob);
  stopSpeaking();
  amyAudio = new Audio(url);
  amyAudio.onended = () => {
    URL.revokeObjectURL(url);
    unduckMic();
  };
  amyAudio.onerror = () => {
    URL.revokeObjectURL(url);
    unduckMic();
  };
  await amyAudio.play();
}

async function speak(text) {
  if (MUTE || !text) {
    unduckMic();
    return;
  }
  duckMic();
  stopSpeaking();
  if (ttsMode === 'laura' || ttsMode === 'openai') {
    try {
      await speakLaura(text);
      return;
    } catch (err) {
      console.warn('Server TTS failed, falling back', err);
      if (/ElevenLabs|OpenAI|API key|quota|rate|credits/i.test(String(err.message || err))) {
        answerEl.textContent = `${text}\n\n(${err.message})`;
      }
    }
  }
  speakBrowser(text);
}

function submitChat() {
  unlockedAudio = true;
  if (asleep) wakeAmy('force');
  const q = inputEl.value.trim();

function renderDrops() {
  dropsEl.innerHTML = '';
  if (!pendingFiles.length) {
    dropsEl.classList.remove('show');
    return;
  }
  dropsEl.classList.add('show');
  pendingFiles.forEach((f, idx) => {
    const chip = document.createElement('span');
    chip.className = 'drop-chip';
    const label = document.createElement('span');
    label.textContent = f.name;
    const rm = document.createElement('button');
    rm.type = 'button';
    rm.textContent = '×';
    rm.title = 'Remove';
    rm.addEventListener('click', () => {
      pendingFiles.splice(idx, 1);
      renderDrops();
    });
    chip.appendChild(label);
    chip.appendChild(rm);
    dropsEl.appendChild(chip);
  });
}

function fileToAttachment(file) {
  return new Promise((resolve, reject) => {
    if (file.size > 8 * 1024 * 1024) {
      reject(new Error(`${file.name} is over 8MB`));
      return;
    }
    const reader = new FileReader();
    reader.onload = () => {
      const dataUrl = String(reader.result || '');
      const data = dataUrl.includes(',') ? dataUrl.split(',')[1] : dataUrl;
      resolve({
        name: file.name,
        media_type: file.type || 'application/octet-stream',
        data,
      });
    };
    reader.onerror = () => reject(new Error(`Couldn't read ${file.name}`));
    reader.readAsDataURL(file);
  });
}

async function addDroppedFiles(fileList) {
  const files = [...(fileList || [])].slice(0, 4);
  if (!files.length) return;
  try {
    for (const file of files) {
      if (pendingFiles.length >= 4) break;
      const att = await fileToAttachment(file);
      pendingFiles.push(att);
    }
    renderDrops();
    setStatus('idle', `${pendingFiles.length} file${pendingFiles.length === 1 ? '' : 's'} ready`);
  } catch (err) {
    answerEl.textContent = String(err.message || err);
  }
}

function openNode(node) {
  if (!node) return;
  document.getElementById('side-group').textContent = node.group || 'note';
  document.getElementById('side-title').textContent = node.label || '';
  document.getElementById('side-body').textContent = node.excerpt || '';
  side.style.display = 'block';
}

document.getElementById('side-close').addEventListener('click', () => { side.style.display = 'none'; });

function highlightNodes(ids) {
  const set = new Set(ids || []);
  graph.nodeColor(n => set.has(n.id) ? '#fbbf24' : colorForGroup(n.group));
  graph.nodeVal(n => set.has(n.id) ? 10 : (viewMode === 'face' ? 5 : 3.6));
}

function colorForGroup(group) {
  const key = String(group || 'notes');
  let h = 0;
  for (let i = 0; i < key.length; i++) h = (h * 31 + key.charCodeAt(i)) % 360;
  return `hsl(${h} 80% 62%)`;
}

function flyToNode(id) {
  const node = (GRAPH.nodes || []).find(n => n.id === id);
  if (!node || node.x == null) return;
  openNode(node);
  const dist = viewMode === 'face' ? 55 : 95;
  graph.cameraPosition({ x: node.x, y: node.y, z: node.z + dist }, node, 1100);
}

function applySources(payload) {
  const ids = Array.isArray(payload.nodes) ? payload.nodes : [];
  if (!payload.move_camera || !ids.length) {
    if (ids.length >= 4) highlightNodes(ids);
    return;
  }
  highlightNodes(ids);
  if (ids.length >= 4) return;
  flyToNode(ids[0]);
}

async function ask(question) {
  if (asleep) {
    wakeAmy('force');
  }
  const q = String(question || '').trim();
  if (!q) return;
  if (looksLikeInterrupt(q) || isInterrupt(q)) {
    handleInterrupt();
    return;
  }
  if (isWhistlePhrase(q) && !pendingFiles.length) {
    doWhistle();
    answerEl.textContent = '♪';
    setStatus(wantListen ? 'listening' : 'idle', wantListen ? 'Listening' : 'Ready');
    return;
  }
  bumpIdle();
  stopSpeaking();
  duckMic();
  answerEl.textContent = '…';
  setStatus('thinking', 'Thinking');
  try { chatAbort?.abort(); } catch (_) {}
  chatAbort = new AbortController();
  const signal = chatAbort.signal;
  try {
    let payload;
    if (/^(remember that|note to self|don't let me forget|dont let me forget|log this)\b/i.test(q)) {
      const r = await fetch('/remember', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ text: q }),
        signal,
      });
      payload = await r.json();
      if (!r.ok) throw new Error(payload.detail || 'remember failed');
      if (payload.id != null) {
        const script = document.createElement('script');
        script.src = '/graph-data.js?t=' + Date.now();
        script.onload = () => {
          graph.graphData(GRAPH);
          applyViewMode(viewMode);
          highlightNodes([payload.id]);
          flyToNode(payload.id);
        };
        document.body.appendChild(script);
      }
    } else if (shareStream && shareStream.active && /\b(this|screen|looking|see|think of)\b/i.test(q)) {
      const frame = await captureShareFrame();
      if (!frame) throw new Error('Screen share ended');
      const r = await fetch('/see', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ question: q, image: frame, media_type: 'image/jpeg' }),
        signal,
      });
      payload = await r.json();
      if (!r.ok) throw new Error(payload.detail || 'see failed');
      payload.move_camera = false;
    } else {
      const r = await fetch('/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          question: q,
          attachments: pendingFiles.map(f => ({
            name: f.name,
            media_type: f.media_type,
            data: f.data,
          })),
        }),
        signal,
      });
      payload = await r.json();
      if (!r.ok) throw new Error(payload.detail || 'chat failed');
      if (payload.move_camera == null) payload.move_camera = true;
      pendingFiles = [];
      renderDrops();
    }
    if (signal.aborted) return;
    answerEl.textContent = payload.answer || '';
    applySources(payload);
    await speak(payload.answer || '');
  } catch (err) {
    if (err && (err.name === 'AbortError' || /aborted/i.test(String(err.message || '')))) {
      unduckMic();
      return;
    }
    answerEl.textContent = String(err.message || err);
    setStatus('idle', 'Error');
    await speak(answerEl.textContent);
  } finally {
    chatAbort = null;
  }
}

async function captureShareFrame() {
  if (!shareStream || !shareStream.active) return null;
  if (!shareVideo) {
    shareVideo = document.createElement('video');
    shareVideo.muted = true;
    shareVideo.playsInline = true;
    shareVideo.srcObject = shareStream;
    await shareVideo.play();
  }
  const w = shareVideo.videoWidth || 1280;
  const h = shareVideo.videoHeight || 720;
  if (!w || !h) return null;
  const canvas = document.createElement('canvas');
  const maxW = 1280;
  const scale = Math.min(1, maxW / w);
  canvas.width = Math.round(w * scale);
  canvas.height = Math.round(h * scale);
  canvas.getContext('2d').drawImage(shareVideo, 0, 0, canvas.width, canvas.height);
  return canvas.toDataURL('image/jpeg', 0.7).split(',')[1];
}

function bypassWord(t) {
  return isInterrupt(t);
}

function armRecognition() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) return null;
  recognition = new SR();
  recognition.continuous = true;
  recognition.interimResults = true;
  recognition.lang = 'en-AU';
  recognition.onstart = () => {
    listening = true;
    syncMicUi();
    if (!isSpeaking) setStatus('listening', 'Listening');
  };
  recognition.onend = () => {
    listening = false;
    // While talking, keep recognition alive for barge-in.
    if (isSpeaking && wantListen) {
      setTimeout(() => {
        if (!wantListen || !isSpeaking || !recognition) return;
        try { recognition.start(); } catch (_) {}
      }, 120);
      syncMicUi();
      return;
    }
    if (micIsDeaf()) {
      syncMicUi();
      return;
    }
    if (wantListen) {
      setTimeout(() => {
        if (!wantListen || isSpeaking || !recognition) return;
        try { recognition.start(); } catch (_) {}
      }, 200);
      syncMicUi();
      return;
    }
    syncMicUi();
    if (statusEl.dataset.mode === 'listening') setStatus('idle', 'Ready');
  };
  recognition.onerror = (ev) => {
    listening = false;
    const err = String(ev.error || 'unknown');
    if (err === 'aborted' || err === 'no-speech') {
      if (wantListen && (isSpeaking || !micIsDeaf())) {
        setTimeout(() => {
          if (!wantListen || !recognition) return;
          try { recognition.start(); } catch (_) {}
        }, 120);
      }
      syncMicUi();
      return;
    }
    if (isSpeaking && wantListen) {
      setTimeout(() => {
        if (!wantListen || !isSpeaking || !recognition) return;
        try { recognition.start(); } catch (_) {}
      }, 180);
      syncMicUi();
      return;
    }
    wantListen = false;
    syncMicUi();
    setStatus('idle', 'Mic error');
    if err === 'not-allowed' || err === 'service-not-allowed') {
      answerEl.textContent = 'Mic blocked in this window. Allow mic, or open Chrome at http://127.0.0.1:4700 for voice.';
      secureHint.style.display = 'block';
    } else if (err === 'network' || err === 'audio-capture') {
      answerEl.textContent = `Mic hiccup (${err}). WebView2 speech is flaky — use Chrome at http://127.0.0.1:4700, or type.`;
    } else {
      answerEl.textContent = `Mic error (${err}). Chrome at http://127.0.0.1:4700 is more reliable for voice.`;
    }
  };
  recognition.onresult = (event) => {
    let finalChunk = '';
    let interimChunk = '';
    for (let i = event.resultIndex; i < event.results.length; i++) {
      const piece = event.results[i][0].transcript;
      if (event.results[i].isFinal) finalChunk += piece;
      else interimChunk += piece;
    }
    finalChunk = finalChunk.trim();
    interimChunk = interimChunk.trim();
    const forInterrupt = finalChunk || interimChunk;
    if (forInterrupt && looksLikeInterrupt(forInterrupt)) {
      handleInterrupt();
      return;
    }
    const chunk = finalChunk;
    if (!chunk) return;
    if (asleep) {
      if (isWakePhrase(chunk)) wakeAmy('voice');
      return;
    }
    if (isWakePhrase(chunk)) {
      bumpIdle();
      return;
    }
    if (isWhistlePhrase(chunk)) {
      doWhistle();
      answerEl.textContent = '♪';
      return;
    }
    // While Amy talks (or echo cooldown), ignore normal speech so she doesn't self-answer.
    if (isSpeaking || micIsDeaf()) return;
    bumpIdle();
    pending = (pending ? pending + ' ' : '') + chunk;
    inputEl.value = pending;
    clearTimeout(finishTimer);
    finishTimer = setTimeout(() => {
      if (asleep || isSpeaking || micIsDeaf()) {
        pending = '';
        return;
      }
      const q = pending.trim();
      pending = '';
      if (q) {
        inputEl.value = '';
        ask(q);
      }
    }, FINISH_MS);
  };
  return recognition;
}

function syncMicUi() {
  const on = !!wantListen;
  micBtn.classList.toggle('active', on);
  micBtn.textContent = on ? 'MUTE' : 'MIC';
  micBtn.title = on ? 'Mute microphone' : 'Microphone';
  const tray = document.getElementById('tray-mic');
  if (tray) {
    tray.classList.toggle('active', on);
    tray.title = on ? 'Mute mic' : 'Mic';
  }
}

function muteMic() {
  wantListen = false;
  clearTimeout(finishTimer);
  finishTimer = null;
  pending = '';
  if (recognition) {
    try { recognition.stop(); } catch (_) {}
  }
  listening = false;
  syncMicUi();
  if (!isSpeaking && statusEl.dataset.mode !== 'thinking') {
    setStatus('idle', 'Mic muted');
  }
}

async function startMic() {
  unlockedAudio = true;
  if (asleep) {
    wakeAmy('click');
  }
  if (!IS_SECURE) {
    answerEl.textContent = 'Chrome won’t give Amy the mic on plain HTTP — use the HTTPS link above.';
    secureHint.style.display = 'block';
    return;
  }
  // Framed WebView shell: SpeechRecognition usually fails even after Allow.
  if (/Edg\//.test(navigator.userAgent) && location.hostname === '127.0.0.1') {
    // Edge app mode is OK; pywebview WebView2 often still breaks. Prefer Chrome.
  }
  if (navigator.mediaDevices?.getUserMedia) {
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      stream.getTracks().forEach((t) => t.stop());
    } catch (err) {
      answerEl.textContent = `Mic permission denied (${err && err.name ? err.name : err}). In Chrome: padlock → Site settings → Microphone → Allow. Or open http://127.0.0.1:4700 in Chrome.`;
      setStatus('idle', 'Mic error');
      return;
    }
  }
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) {
    answerEl.textContent = 'This window has no SpeechRecognition. Close the Amy frame and use Chrome at http://127.0.0.1:4700 — typing still works here.';
    setStatus('idle', 'Mic error');
    return;
  }
  if (!recognition) armRecognition();
  if (!recognition) {
    answerEl.textContent = 'Couldn’t arm the mic. Use Chrome at http://127.0.0.1:4700.';
    return;
  }
  wantListen = true;
  syncMicUi();
  if (!asleep) setStatus('listening', 'Listening');
  bumpIdle();
  try {
    recognition.start();
  } catch (err) {
    answerEl.textContent = `Mic start failed (${err && err.message ? err.message : err}). Try Chrome at http://127.0.0.1:4700.`;
    setStatus('idle', 'Mic error');
    wantListen = false;
    syncMicUi();
  }
}

function toggleMic() {
  if (wantListen || listening) muteMic();
  else startMic();
}

async function toggleEyes() {
  unlockedAudio = true;
  if (shareStream) {
    shareStream.getTracks().forEach(t => t.stop());
    shareStream = null;
    shareVideo = null;
    shareDot.style.display = 'none';
    eyesBtn.classList.remove('active');
    return;
  }
  if (!IS_SECURE) {
    answerEl.textContent = 'Eyes also need HTTPS for screen share.';
    secureHint.style.display = 'block';
    return;
  }
  try {
    shareStream = await navigator.mediaDevices.getDisplayMedia({ video: true, audio: false });
    shareDot.style.display = 'block';
    eyesBtn.classList.add('active');
    shareStream.getVideoTracks()[0].addEventListener('ended', () => {
      shareStream = null;
      shareVideo = null;
      shareDot.style.display = 'none';
      eyesBtn.classList.remove('active');
    });
  } catch (_) {
    answerEl.textContent = 'Screen share cancelled.';
  }
}

function applyViewMode(mode) {
  viewMode = mode;
  document.querySelectorAll('.modes button').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.view === mode);
  });
  if (!graph) return;
  const controls = graph.controls();
  controls.autoRotate = false;
  if (mode === 'ring') {
    graph.cameraPosition({ x: 0, y: 0, z: 280 }, { x: 0, y: 0, z: 0 }, 900);
  } else if (mode === 'cube') {
    graph.cameraPosition({ x: 180, y: 140, z: 180 }, { x: 0, y: 0, z: 0 }, 900);
  } else {
    graph.cameraPosition({ x: 40, y: 20, z: 120 }, { x: 0, y: 0, z: 0 }, 900);
  }
  graph.nodeVal(viewMode === 'face' ? 5 : 3.6);
  graph.nodeRelSize(viewMode === 'face' ? 7 : 5);
}

micBtn.addEventListener('click', toggleMic);
document.getElementById('tray-mic').addEventListener('click', toggleMic);
if (stopBtn) stopBtn.addEventListener('click', () => {

  handleInterrupt();
});
sendBtn.addEventListener('click', submitChat);

document.getElementById('tray-file').addEventListener('click', () => fileInput.click());
fileInput.addEventListener('change', () => {
  addDroppedFiles(fileInput.files);
  fileInput.value = '';
});
;['dragenter', 'dragover'].forEach(evt => {
  dockEl.addEventListener(evt, (e) => {
    e.preventDefault();

    dockEl.classList.add('dragover');

});
;['dragleave', 'drop'].forEach(evt => {

window.addEventListener('dragover', (e) => e.preventDefault());
window.addEventListener('drop', (e) => e.preventDefault());
inputEl.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') {
    e.preventDefault();
    submitChat();
  }
});
window.addEventListener('keydown', (e) => {

  }
});
eyesBtn.addEventListener('click', toggleEyes);
document.getElementById('tray-eyes').addEventListener('click', toggleEyes);
document.getElementById('tray-refresh').addEventListener('click', () => {
  const script = document.createElement('script');
  script.src = '/graph-data.js?t=' + Date.now();
  script.onload = () => {
    graph.graphData(GRAPH);
    applyViewMode(viewMode);
    brandSub.textContent = `${(GRAPH.nodes || []).length} notes · live`;
  };
  document.body.appendChild(script);
});
document.querySelectorAll('.modes button').forEach(btn => {
  btn.addEventListener('click', () => applyViewMode(btn.dataset.view));
});
searchEl.addEventListener('keydown', (e) => {
  if (e.key !== 'Enter') return;
  const q = searchEl.value.trim().toLowerCase();
  if (!q) return;
  const hit = (GRAPH.nodes || []).find(n =>
    String(n.label || '').toLowerCase().includes(q) ||
    String(n.group || '').toLowerCase().includes(q) ||
    String(n.excerpt || '').toLowerCase().includes(q)
  );
  if (hit) { highlightNodes([hit.id]); flyToNode(hit.id); }
  else ask(searchEl.value.trim());
});

function paintStars() {
  const canvas = document.getElementById('stars');
  const ctx = canvas.getContext('2d');
  const resize = () => {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    for (let i = 0; i < 320; i++) {
      const x = Math.random() * canvas.width;
      const y = Math.random() * canvas.height;
      const r = Math.random() * 1.6;
      ctx.fillStyle = `rgba(186,230,253,${0.15 + Math.random() * 0.7})`;
      ctx.beginPath();
      ctx.arc(x, y, r, 0, Math.PI * 2);
      ctx.fill();
    }
  };
  resize();
  window.addEventListener('resize', resize);
}

function bootGraph() {
  const data = (typeof GRAPH !== 'undefined') ? GRAPH : { nodes: [], links: [] };
  graph = ForceGraph3D()(document.getElementById('graph'))
    .graphData(data)
    .backgroundColor('#00000000')
    .showNavInfo(false)
    .nodeLabel('label')
    .nodeColor(n => colorForGroup(n.group))
    .nodeVal(3.6)
    .nodeRelSize(5)
    .nodeOpacity(0.95)
    .linkColor(() => 'rgba(125,211,252,0.28)')
    .linkWidth(0.55)
    .linkOpacity(0.55)
    .onNodeClick(node => {
      unlockedAudio = true;
      openNode(node);
      highlightNodes([node.id]);
      flyToNode(node.id);
    });
  applyViewMode('ring');
}

async function bootGreeting() {
  try {
    const r = await fetch('/api/hello');
    const data = await r.json();
    brandSub.textContent = `${data.note_count || 0} notes · workshop`;
    modelChip.textContent = prettyModel(data.model || 'MODEL');
    ttsMode = (data.tts === 'laura' || data.tts === 'openai') ? data.tts : 'browser';
    ttsVoiceLabel = data.tts_voice || (ttsMode === 'openai' ? 'Nova' : 'Laura');
    if (ttsMode === 'laura') {
      modelChip.title = `Brain + ElevenLabs ${ttsVoiceLabel}`;
    } else if (ttsMode === 'openai') {
      modelChip.title = `Brain + OpenAI ${ttsVoiceLabel}`;
    }
    // Unlock audio on first tap — no spoken/written intro.
    const once = () => {
      unlockedAudio = true;
      window.removeEventListener('pointerdown', once);
    };
    window.addEventListener('pointerdown', once, { once: true });
  } catch (_) {
    brandSub.textContent = 'offline brain';
  }
}

function prettyModel(raw) {
  return String(raw || 'MODEL').replace(/gpt-?/i, 'GPT ').replace(/-/g, ' ').replace(/\s+/g, ' ').trim().toUpperCase();
}

paintStars();
bootGraph();
armRecognition();
bootGreeting();
bumpIdle();
document.getElementById('amy-face-wrap')?.addEventListener('click', () => {
  unlockedAudio = true;
  if (asleep) wakeAmy('click');
  else bumpIdle();
});
(function freezeAmyFace() {
  const vid = document.getElementById('amy-face-video');
  if (!vid) return;
  const freeze = () => {
    try {
      if (!Number.isFinite(vid.duration) || vid.duration === 0) return;
      vid.currentTime = Math.min(0.35, Math.max(0.05, vid.duration * 0.12));
      vid.dataset.frozen = '1';
      vid.pause();
    } catch (_) {}
  };
  if (vid.readyState >= 1) freeze();
  else vid.addEventListener('loadedmetadata', freeze, { once: true });
})();
window.speechSynthesis?.addEventListener?.('voiceschanged', () => {
  cachedVoice = null;
  pickVoice();
});
