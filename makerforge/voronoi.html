<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Voronoi Generator · MakerDeck</title>
<script type="importmap">
{ "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.164.1/examples/jsm/"
} }
</script>
<link rel="stylesheet" href="css/makerdeck.css">
<style>
/* -- Voronoi-specific layout --------------------------------------- */
:root{ --sidebar-w:280px; --footer-h:32px; }
.app{display:grid;height:100vh;
  grid-template-rows:var(--nav-h) 1fr var(--footer-h);
  grid-template-columns:var(--sidebar-w) 1fr;
  grid-template-areas:
    "nav      nav"
    "sidebar  viewport"
    "footer   footer";
}
.sidebar{grid-area:sidebar;background:var(--panel);border-right:1px solid var(--border);
  overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:12px}
.viewport{grid-area:viewport;position:relative;background:var(--bg);overflow:hidden}
.viewport canvas{display:block;width:100%!important;height:100%!important}
.drop-zone .icon{font-size:28px;margin-bottom:6px}
.mode-grid{display:grid;grid-template-columns:1fr 1fr;gap:4px}
.mode-btn{padding:8px;border-radius:var(--radius-sm);border:1px solid var(--border);
  text-align:center;font-size:12px;font-weight:600;transition:all .15s}
.mode-btn:hover{border-color:var(--accent);color:var(--accent)}
.mode-btn.active{border-color:var(--accent);background:var(--accent-dim);color:var(--accent)}
</style>
</head>
<body>
<div class="app">

  <!-- Nav (injected by js/nav.js) -->
  <nav class="md-nav"></nav>

  <!-- Sidebar -->
  <div class="sidebar">

    <!-- Load -->
    <div>
      <div class="section-label">Load Model</div>
      <div class="drop-zone" id="dropZone">
        <div class="icon">&#x1F4E6;</div>
        Drop STL here or click to browse
        <input type="file" id="fileInput" accept=".stl" hidden>
      </div>
    </div>

    <!-- Mode -->
    <div>
      <div class="section-label">Voronoi Mode</div>
      <div class="mode-grid">
        <button class="mode-btn active" id="modeHoles" data-mode="holes">&#x25CB; Holes</button>
        <button class="mode-btn" id="modeLattice" data-mode="lattice">&#x25A1; Lattice</button>
      </div>
    </div>

    <!-- Parameters -->
    <div>
      <div class="section-label">Parameters</div>

      <div class="form-group">
        <div class="form-label"><span>Cell Count</span><span class="val" id="cellCountVal">80</span></div>
        <input type="range" id="cellCount" min="10" max="500" value="80" step="5">
      </div>

      <div class="form-group">
        <div class="form-label"><span>Wall Thickness</span><span class="val" id="wallThickVal">0.8mm</span></div>
        <input type="range" id="wallThick" min="0.2" max="3.0" value="0.8" step="0.1">
      </div>

      <div class="form-group">
        <div class="form-label"><span>Shell Thickness</span><span class="val" id="shellThickVal">1.2mm</span></div>
        <input type="range" id="shellThick" min="0.4" max="5.0" value="1.2" step="0.1">
      </div>

      <div class="form-group">
        <div class="form-label"><span>Randomness</span><span class="val" id="randomVal">50%</span></div>
        <input type="range" id="randomness" min="0" max="100" value="50" step="5">
      </div>

      <label class="cb-label">
        <input type="checkbox" id="smoothEdges" checked>
        <span>Smooth cell edges</span>
      </label>
    </div>

    <!-- Actions -->
    <div>
      <div class="section-label">Generate</div>
      <div class="btn-row">
        <button class="btn btn-primary" id="generateBtn" disabled style="flex:1">Generate Voronoi</button>
      </div>
      <div class="progress-bar" id="progressBar" style="margin-top:6px;display:none">
        <div class="fill" id="progressFill"></div>
      </div>
    </div>

    <!-- Stats -->
    <div id="statsPanel" style="display:none">
      <div class="section-label">Result Stats</div>
      <div class="stat-grid">
        <span class="label">Original faces</span><span class="val" id="statOrigFaces">—</span>
        <span class="label">Result faces</span><span class="val" id="statResultFaces">—</span>
        <span class="label">Cells</span><span class="val" id="statCells">—</span>
        <span class="label">Removed</span><span class="val" id="statRemoved">—</span>
        <span class="label">Wall faces</span><span class="val" id="statWalls">—</span>
        <span class="label">Rim faces</span><span class="val" id="statRims">—</span>
      </div>
    </div>

    <!-- Export -->
    <div>
      <div class="section-label">Export</div>
      <div class="btn-row">
        <button class="btn" id="exportSTLBtn" disabled style="flex:1">Download STL</button>
        <button class="btn btn-danger" id="resetBtn" disabled>Reset</button>
      </div>
    </div>

  </div>

  <!-- Viewport -->
  <div class="viewport" id="viewport">
    <div class="viewport-toolbar">
      <button id="tbFrame">Frame</button>
      <button id="tbWire">Wire</button>
      <button id="tbSpin" class="active">Spin</button>
      <button id="tbOriginal">Original</button>
    </div>
    <div class="statusbar"><span id="status">Drop an STL to begin</span></div>
  </div>

  <!-- Footer -->
  <div class="md-footer">
    <span id="fileName">No model loaded</span>
    <span>Voronoi Generator</span>
  </div>

</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import './nav.js';

/* ================================================================== */
/*  Helpers                                                           */
/* ================================================================== */
const $ = id => document.getElementById(id);

function setStatus(msg) { $('status').textContent = msg; }
function showProgress(pct) {
  $('progressBar').style.display = 'block';
  $('progressFill').style.width = pct + '%';
}
function hideProgress() { $('progressBar').style.display = 'none'; }

/* ================================================================== */
/*  Three.js Scene                                                    */
/* ================================================================== */
const viewport = $('viewport');
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setClearColor(0x060a10);
viewport.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(40, 1, 0.1, 5000);
camera.position.set(0, 0, 200);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.dampingFactor = 0.12;

scene.add(new THREE.AmbientLight(0xffffff, 0.5));
const dirLight = new THREE.DirectionalLight(0xffffff, 1.0);
dirLight.position.set(1, 2, 3);
scene.add(dirLight);
const backLight = new THREE.DirectionalLight(0x3ecfff, 0.3);
backLight.position.set(-1, -1, -2);
scene.add(backLight);

let meshOriginal = null, meshResult = null;
let wireHelper = null;
let autoRotate = true;
let showingOriginal = false;

function resize() {
  const w = viewport.clientWidth, h = viewport.clientHeight;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
}
window.addEventListener('resize', resize);
resize();

function animate() {
  requestAnimationFrame(animate);
  if (autoRotate && (meshOriginal || meshResult)) {
    const target = meshResult || meshOriginal;
    if (target) target.rotation.y += 0.003;
    if (meshOriginal && meshResult) meshOriginal.rotation.y = meshResult.rotation.y;
  }
  controls.update();
  renderer.render(scene, camera);
}
animate();

function frameModel(mesh) {
  if (!mesh) return;
  const box = new THREE.Box3().setFromObject(mesh);
  const center = box.getCenter(new THREE.Vector3());
  const size = box.getSize(new THREE.Vector3());
  const maxDim = Math.max(size.x, size.y, size.z);
  camera.position.set(center.x, center.y, center.z + maxDim * 1.8);
  controls.target.copy(center);
  controls.update();
}

/* ================================================================== */
/*  STL Parsing                                                       */
/* ================================================================== */
function parseSTL(buffer) {
  const dv = new DataView(buffer);
  const nTri = dv.getUint32(80, true);
  const positions = new Float32Array(nTri * 9);
  const normals = new Float32Array(nTri * 3);
  let off = 84;
  for (let i = 0; i < nTri; i++) {
    normals[i * 3]     = dv.getFloat32(off, true);
    normals[i * 3 + 1] = dv.getFloat32(off + 4, true);
    normals[i * 3 + 2] = dv.getFloat32(off + 8, true);
    off += 12;
    for (let v = 0; v < 9; v++) {
      positions[i * 9 + v] = dv.getFloat32(off, true);
      off += 4;
    }
    off += 2;
  }
  return { positions, normals, nTri };
}

/* ================================================================== */
/*  Voronoi Core v2 — distance-to-boundary + shell generation         */
/* ================================================================== */

/** Poisson-disc-ish sampling on mesh surface */
function sampleSeedPoints(positions, nTri, count, randomness) {
  const areas = new Float32Array(nTri);
  let totalArea = 0;
  for (let i = 0; i < nTri; i++) {
    const o = i * 9;
    const ex = positions[o+3]-positions[o], ey = positions[o+4]-positions[o+1], ez = positions[o+5]-positions[o+2];
    const fx = positions[o+6]-positions[o], fy = positions[o+7]-positions[o+1], fz = positions[o+8]-positions[o+2];
    const cx = ey*fz-ez*fy, cy = ez*fx-ex*fz, cz = ex*fy-ey*fx;
    areas[i] = 0.5 * Math.sqrt(cx*cx+cy*cy+cz*cz);
    totalArea += areas[i];
  }
  const cdf = new Float64Array(nTri);
  cdf[0] = areas[0] / totalArea;
  for (let i = 1; i < nTri; i++) cdf[i] = cdf[i-1] + areas[i] / totalArea;

  // Use dart-throwing with rejection for better spacing
  const seeds = [];
  const jitter = randomness / 100;
  const minDist = Math.sqrt(totalArea / count) * 0.4 * (1 - jitter * 0.8);

  for (let s = 0; s < count; s++) {
    let bestPt = null, bestMinD = -1;
    const attempts = s < 20 ? 1 : 15; // More attempts = better spacing
    for (let a = 0; a < attempts; a++) {
      const r = Math.random();
      let lo = 0, hi = nTri - 1;
      while (lo < hi) { const mid = (lo+hi)>>1; if (cdf[mid] < r) lo = mid+1; else hi = mid; }
      const o = lo * 9;
      let u = Math.random(), v = Math.random();
      if (u+v > 1) { u = 1-u; v = 1-v; }
      const px = positions[o]+u*(positions[o+3]-positions[o])+v*(positions[o+6]-positions[o]);
      const py = positions[o+1]+u*(positions[o+4]-positions[o+1])+v*(positions[o+7]-positions[o+1]);
      const pz = positions[o+2]+u*(positions[o+5]-positions[o+2])+v*(positions[o+8]-positions[o+2]);
      // Check min distance to existing seeds
      let md = Infinity;
      for (let j = 0; j < seeds.length; j += 3) {
        const dx = px-seeds[j], dy = py-seeds[j+1], dz = pz-seeds[j+2];
        md = Math.min(md, dx*dx+dy*dy+dz*dz);
      }
      if (md > bestMinD) { bestMinD = md; bestPt = [px, py, pz]; }
    }
    if (bestPt) seeds.push(...bestPt);
  }
  return new Float32Array(seeds);
}

/** For each face, find closest + second-closest seed, compute boundary distance */
function computeBoundaryDistance(positions, nTri, seeds, nSeeds) {
  const dist = new Float32Array(nTri);     // distance to nearest Voronoi boundary
  const cellOf = new Uint16Array(nTri);

  for (let i = 0; i < nTri; i++) {
    const o = i * 9;
    const cx = (positions[o]+positions[o+3]+positions[o+6]) / 3;
    const cy = (positions[o+1]+positions[o+4]+positions[o+7]) / 3;
    const cz = (positions[o+2]+positions[o+5]+positions[o+8]) / 3;

    // Find two closest seeds
    let d1 = Infinity, d2 = Infinity, s1 = 0, s2 = 0;
    for (let s = 0; s < nSeeds; s++) {
      const dx = cx-seeds[s*3], dy = cy-seeds[s*3+1], dz = cz-seeds[s*3+2];
      const dd = dx*dx+dy*dy+dz*dz;
      if (dd < d1) { d2 = d1; s2 = s1; d1 = dd; s1 = s; }
      else if (dd < d2) { d2 = dd; s2 = s; }
    }
    cellOf[i] = s1;

    // Distance to the bisector plane between s1 and s2
    // Plane normal = s2 - s1, plane passes through midpoint
    const mx = (seeds[s1*3]+seeds[s2*3])/2;
    const my = (seeds[s1*3+1]+seeds[s2*3+1])/2;
    const mz = (seeds[s1*3+2]+seeds[s2*3+2])/2;
    const nx = seeds[s2*3]-seeds[s1*3], ny = seeds[s2*3+1]-seeds[s1*3+1], nz = seeds[s2*3+2]-seeds[s1*3+2];
    const nLen = Math.sqrt(nx*nx+ny*ny+nz*nz);
    if (nLen > 1e-10) {
      dist[i] = Math.abs((cx-mx)*(nx/nLen)+(cy-my)*(ny/nLen)+(cz-mz)*(nz/nLen));
    }
  }
  return { dist, cellOf };
}

/** Compute per-vertex normals from face soup positions */
function computeVertexNormals(positions, nTri) {
  const EPS = 1e-5;
  const vKey = (x,y,z) => `${(Math.round(x/EPS)*EPS).toFixed(4)},${(Math.round(y/EPS)*EPS).toFixed(4)},${(Math.round(z/EPS)*EPS).toFixed(4)}`;
  const normalAccum = new Map(); // key → [nx, ny, nz]

  for (let i = 0; i < nTri; i++) {
    const o = i * 9;
    const ex = positions[o+3]-positions[o], ey = positions[o+4]-positions[o+1], ez = positions[o+5]-positions[o+2];
    const fx = positions[o+6]-positions[o], fy = positions[o+7]-positions[o+1], fz = positions[o+8]-positions[o+2];
    let nx = ey*fz-ez*fy, ny = ez*fx-ex*fz, nz = ex*fy-ey*fx;
    const len = Math.sqrt(nx*nx+ny*ny+nz*nz);
    if (len > 1e-10) { nx /= len; ny /= len; nz /= len; }

    for (let v = 0; v < 3; v++) {
      const vi = o + v*3;
      const k = vKey(positions[vi], positions[vi+1], positions[vi+2]);
      let acc = normalAccum.get(k);
      if (!acc) { acc = [0,0,0]; normalAccum.set(k, acc); }
      acc[0] += nx; acc[1] += ny; acc[2] += nz;
    }
  }
  // Normalize accumulated normals
  for (const n of normalAccum.values()) {
    const len = Math.sqrt(n[0]*n[0]+n[1]*n[1]+n[2]*n[2]);
    if (len > 1e-10) { n[0] /= len; n[1] /= len; n[2] /= len; }
  }
  return { normalAccum, vKey };
}

/** Build double-walled shell mesh from kept faces */
function buildShellMesh(positions, normals, nTri, keepMask, shellThick) {
  // 1. Compute vertex normals for offset direction
  const { normalAccum, vKey } = computeVertexNormals(positions, nTri);

  // 2. Count kept faces
  let nKept = 0;
  for (let i = 0; i < nTri; i++) if (keepMask[i]) nKept++;

  // 3. Find boundary edges (between kept and removed faces)
  const EPS = 1e-5;
  const edgeKey = (x0,y0,z0,x1,y1,z1) => {
    const k0 = vKey(x0,y0,z0), k1 = vKey(x1,y1,z1);
    return k0 < k1 ? k0+'|'+k1 : k1+'|'+k0;
  };

  // Map edge → [faceIdx, kept?]
  const edgeFaces = new Map();
  for (let i = 0; i < nTri; i++) {
    const o = i * 9;
    const verts = [[o,o+3],[o+3,o+6],[o,o+6]];
    for (const [a,b] of verts) {
      const ek = edgeKey(positions[a],positions[a+1],positions[a+2],
                         positions[b],positions[b+1],positions[b+2]);
      if (!edgeFaces.has(ek)) edgeFaces.set(ek, []);
      edgeFaces.get(ek).push({ face: i, kept: !!keepMask[i] });
    }
  }

  // Boundary edges: one kept face, one removed face (or only one face = mesh boundary)
  const boundaryEdges = [];
  for (const [ek, faces] of edgeFaces) {
    const hasKept = faces.some(f => f.kept);
    const hasRemoved = faces.some(f => !f.kept);
    if (hasKept && (hasRemoved || faces.length === 1)) {
      // Parse the edge key back to coordinates
      const parts = ek.split('|');
      const [x0,y0,z0] = parts[0].split(',').map(Number);
      const [x1,y1,z1] = parts[1].split(',').map(Number);
      boundaryEdges.push({ x0,y0,z0, x1,y1,z1 });
    }
  }

  // 4. Allocate output: outer faces + inner faces + rim quads (2 tris each)
  const nRim = boundaryEdges.length;
  const totalTri = nKept * 2 + nRim * 2;
  const outPos = new Float32Array(totalTri * 9);
  const outNorm = new Float32Array(totalTri * 9);
  let idx = 0;

  // Helper: get vertex normal for offset
  function getVN(x, y, z) {
    const k = vKey(x, y, z);
    return normalAccum.get(k) || [0, 0, 1];
  }

  // 5a. Outer surface (original kept faces)
  for (let i = 0; i < nTri; i++) {
    if (!keepMask[i]) continue;
    const o = i * 9, no = i * 3;
    for (let v = 0; v < 9; v++) outPos[idx*9+v] = positions[o+v];
    // Face normal for all 3 vertices
    const fn = [normals[no], normals[no+1], normals[no+2]];
    for (let v = 0; v < 3; v++) {
      outNorm[idx*9+v*3] = fn[0]; outNorm[idx*9+v*3+1] = fn[1]; outNorm[idx*9+v*3+2] = fn[2];
    }
    idx++;
  }

  // 5b. Inner surface (offset inward, reversed winding)
  for (let i = 0; i < nTri; i++) {
    if (!keepMask[i]) continue;
    const o = i * 9, no = i * 3;
    // Reversed winding: swap v1 and v2
    for (let v = 0; v < 3; v++) {
      const sv = v === 0 ? 0 : v === 1 ? 2 : 1; // 0,2,1 for reversed winding
      const si = o + sv * 3;
      const vn = getVN(positions[si], positions[si+1], positions[si+2]);
      outPos[idx*9+v*3]   = positions[si]   - vn[0] * shellThick;
      outPos[idx*9+v*3+1] = positions[si+1] - vn[1] * shellThick;
      outPos[idx*9+v*3+2] = positions[si+2] - vn[2] * shellThick;
      // Flipped normal
      outNorm[idx*9+v*3] = -normals[no]; outNorm[idx*9+v*3+1] = -normals[no+1]; outNorm[idx*9+v*3+2] = -normals[no+2];
    }
    idx++;
  }

  // 5c. Rim faces — connect outer to inner at each boundary edge
  for (const e of boundaryEdges) {
    const vn0 = getVN(e.x0, e.y0, e.z0);
    const vn1 = getVN(e.x1, e.y1, e.z1);

    // Outer edge points
    const ox0 = e.x0, oy0 = e.y0, oz0 = e.z0;
    const ox1 = e.x1, oy1 = e.y1, oz1 = e.z1;
    // Inner edge points (offset inward)
    const ix0 = e.x0 - vn0[0]*shellThick, iy0 = e.y0 - vn0[1]*shellThick, iz0 = e.z0 - vn0[2]*shellThick;
    const ix1 = e.x1 - vn1[0]*shellThick, iy1 = e.y1 - vn1[1]*shellThick, iz1 = e.z1 - vn1[2]*shellThick;

    // Compute rim face normal (cross product of edge direction and shell direction)
    const edx = ox1-ox0, edy = oy1-oy0, edz = oz1-oz0;
    const sdx = ix0-ox0, sdy = iy0-oy0, sdz = iz0-oz0;
    let rnx = edy*sdz-edz*sdy, rny = edz*sdx-edx*sdz, rnz = edx*sdy-edy*sdx;
    const rLen = Math.sqrt(rnx*rnx+rny*rny+rnz*rnz);
    if (rLen > 1e-10) { rnx /= rLen; rny /= rLen; rnz /= rLen; }

    // Triangle 1: ox0, ox1, ix1
    outPos[idx*9]   = ox0; outPos[idx*9+1] = oy0; outPos[idx*9+2] = oz0;
    outPos[idx*9+3] = ox1; outPos[idx*9+4] = oy1; outPos[idx*9+5] = oz1;
    outPos[idx*9+6] = ix1; outPos[idx*9+7] = iy1; outPos[idx*9+8] = iz1;
    for (let v = 0; v < 3; v++) { outNorm[idx*9+v*3] = rnx; outNorm[idx*9+v*3+1] = rny; outNorm[idx*9+v*3+2] = rnz; }
    idx++;

    // Triangle 2: ox0, ix1, ix0
    outPos[idx*9]   = ox0; outPos[idx*9+1] = oy0; outPos[idx*9+2] = oz0;
    outPos[idx*9+3] = ix1; outPos[idx*9+4] = iy1; outPos[idx*9+5] = iz1;
    outPos[idx*9+6] = ix0; outPos[idx*9+7] = iy0; outPos[idx*9+8] = iz0;
    for (let v = 0; v < 3; v++) { outNorm[idx*9+v*3] = rnx; outNorm[idx*9+v*3+1] = rny; outNorm[idx*9+v*3+2] = rnz; }
    idx++;
  }

  return { positions: outPos, normals: outNorm, nTri: totalTri };
}

/** Build single-surface mesh from kept faces (no shell) */
function buildFilteredMesh(positions, normals, nTri, keepMask) {
  let count = 0;
  for (let i = 0; i < nTri; i++) if (keepMask[i]) count++;
  const outPos = new Float32Array(count * 9);
  const outNorm = new Float32Array(count * 9);
  let idx = 0;
  for (let i = 0; i < nTri; i++) {
    if (!keepMask[i]) continue;
    const po = i * 9, no = i * 3;
    for (let v = 0; v < 9; v++) outPos[idx*9+v] = positions[po+v];
    for (let v = 0; v < 3; v++) {
      outNorm[idx*9+v*3] = normals[no]; outNorm[idx*9+v*3+1] = normals[no+1]; outNorm[idx*9+v*3+2] = normals[no+2];
    }
    idx++;
  }
  return { positions: outPos, normals: outNorm, nTri: count };
}

/** Full Voronoi generation pipeline v2 */
function generateVoronoi(positions, normals, nTri, opts) {
  const { cellCount, wallThick, shellThick, randomness, mode, smooth } = opts;

  setStatus('Sampling seed points…'); showProgress(5);
  const seeds = sampleSeedPoints(positions, nTri, cellCount, randomness);
  showProgress(15);

  setStatus('Computing Voronoi boundaries…'); showProgress(20);
  const { dist, cellOf } = computeBoundaryDistance(positions, nTri, seeds, cellCount);
  showProgress(50);

  // Build keep mask: faces close to boundary = wall, faces far from boundary = hole
  setStatus('Classifying faces…');
  const keepMask = new Uint8Array(nTri);
  const halfWall = wallThick / 2;

  if (mode === 'lattice') {
    // Lattice: keep only faces near boundary (the wall network)
    for (let i = 0; i < nTri; i++) keepMask[i] = dist[i] <= halfWall ? 1 : 0;
  } else {
    // Holes: keep faces near boundary (walls), remove cell interiors (holes)
    for (let i = 0; i < nTri; i++) keepMask[i] = dist[i] <= halfWall ? 1 : 0;
  }
  showProgress(60);

  // Build result mesh with shell
  setStatus('Building shell mesh…');
  const nKept = keepMask.reduce((a,b) => a+b, 0);
  const result = buildShellMesh(positions, normals, nTri, keepMask, shellThick);
  showProgress(95);

  const removed = nTri - nKept;
  setStatus(`Done — ${result.nTri.toLocaleString()} faces (${nKept.toLocaleString()} kept × 2 walls + rims), removed ${removed.toLocaleString()} cell interiors`);
  showProgress(100);

  return { result, cellCount, removed, keepMask, nKept };
}

/* ================================================================== */
/*  Export Binary STL                                                  */
/* ================================================================== */
function exportSTLBinary(positions, normals, nTri) {
  const bufSize = 84 + nTri * 50;
  const buf = new ArrayBuffer(bufSize);
  const dv = new DataView(buf);
  // Header
  const header = 'MakerDeck Voronoi Generator b504';
  for (let i = 0; i < 80; i++) dv.setUint8(i, i < header.length ? header.charCodeAt(i) : 0);
  dv.setUint32(80, nTri, true);
  let off = 84;
  for (let i = 0; i < nTri; i++) {
    // Face normal (use first vertex normal, which equals face normal)
    dv.setFloat32(off, normals[i*9], true);
    dv.setFloat32(off+4, normals[i*9+1], true);
    dv.setFloat32(off+8, normals[i*9+2], true);
    off += 12;
    for (let v = 0; v < 9; v++) {
      dv.setFloat32(off, positions[i*9+v], true);
      off += 4;
    }
    dv.setUint16(off, 0, true);
    off += 2;
  }
  return buf;
}

/* ================================================================== */
/*  State                                                             */
/* ================================================================== */
let S = {
  loaded: false,
  positions: null, normals: null, nTri: 0,
  result: null,
  mode: 'holes',
  fileName: ''
};

/* ================================================================== */
/*  File Loading                                                      */
/* ================================================================== */
function loadSTL(buffer, name) {
  const parsed = parseSTL(buffer);
  S.positions = parsed.positions;
  S.normals = parsed.normals;
  S.nTri = parsed.nTri;
  S.loaded = true;
  S.result = null;
  S.fileName = name;
  showingOriginal = false;

  $('fileName').textContent = `${name} — ${S.nTri.toLocaleString()} faces`;
  $('generateBtn').disabled = false;
  $('resetBtn').disabled = false;
  $('exportSTLBtn').disabled = true;
  $('statsPanel').style.display = 'none';
  $('tbOriginal').classList.remove('active');

  // Show in viewport
  if (meshResult) { scene.remove(meshResult); meshResult = null; }
  if (wireHelper) { scene.remove(wireHelper); wireHelper = null; }
  showOriginalMesh(parsed.positions, parsed.nTri);
  frameModel(meshOriginal);
  setStatus(`Loaded ${name} — ${S.nTri.toLocaleString()} faces`);
}

function showOriginalMesh(positions, nTri) {
  if (meshOriginal) scene.remove(meshOriginal);
  const geom = new THREE.BufferGeometry();
  geom.setAttribute('position', new THREE.BufferAttribute(new Float32Array(positions), 3));
  geom.computeVertexNormals();
  const mat = new THREE.MeshStandardMaterial({
    color: 0xb0b0b0, metalness: 0.1, roughness: 0.6,
    side: THREE.DoubleSide, flatShading: true
  });
  meshOriginal = new THREE.Mesh(geom, mat);
  scene.add(meshOriginal);
}

function showResultMesh(positions, normals, nTri) {
  if (meshResult) scene.remove(meshResult);
  if (wireHelper) { scene.remove(wireHelper); wireHelper = null; }

  const geom = new THREE.BufferGeometry();
  geom.setAttribute('position', new THREE.BufferAttribute(new Float32Array(positions), 3));
  geom.computeVertexNormals();
  const mat = new THREE.MeshStandardMaterial({
    color: 0x3ecfff, metalness: 0.15, roughness: 0.5,
    side: THREE.DoubleSide, flatShading: true
  });
  meshResult = new THREE.Mesh(geom, mat);

  // Copy rotation from original
  if (meshOriginal) meshResult.rotation.copy(meshOriginal.rotation);

  scene.add(meshResult);
  meshOriginal.visible = false;
  showingOriginal = false;
}

/* ================================================================== */
/*  UI Bindings                                                       */
/* ================================================================== */

// Drop zone
const dropZone = $('dropZone');
const fileInput = $('fileInput');
dropZone.addEventListener('click', () => fileInput.click());
dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('dragover'); });
dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
dropZone.addEventListener('drop', e => {
  e.preventDefault(); dropZone.classList.remove('dragover');
  const file = e.dataTransfer.files[0];
  if (file && file.name.toLowerCase().endsWith('.stl')) {
    file.arrayBuffer().then(buf => loadSTL(buf, file.name));
  }
});
fileInput.addEventListener('change', () => {
  const file = fileInput.files[0];
  if (file) file.arrayBuffer().then(buf => loadSTL(buf, file.name));
});

// Mode buttons
$('modeHoles').addEventListener('click', () => { S.mode = 'holes'; updateModeUI(); });
$('modeLattice').addEventListener('click', () => { S.mode = 'lattice'; updateModeUI(); });
function updateModeUI() {
  $('modeHoles').classList.toggle('active', S.mode === 'holes');
  $('modeLattice').classList.toggle('active', S.mode === 'lattice');
}

// Sliders
$('cellCount').addEventListener('input', e => { $('cellCountVal').textContent = e.target.value; });
$('wallThick').addEventListener('input', e => { $('wallThickVal').textContent = e.target.value + 'mm'; });
$('shellThick').addEventListener('input', e => { $('shellThickVal').textContent = e.target.value + 'mm'; });
$('randomness').addEventListener('input', e => { $('randomVal').textContent = e.target.value + '%'; });

// Generate
$('generateBtn').addEventListener('click', () => {
  if (!S.loaded) return;
  $('generateBtn').disabled = true;

  // Use requestAnimationFrame to let UI update
  requestAnimationFrame(() => {
    try {
      const opts = {
        cellCount: parseInt($('cellCount').value),
        wallThick: parseFloat($('wallThick').value),
        shellThick: parseFloat($('shellThick').value),
        randomness: parseInt($('randomness').value),
        mode: S.mode,
        smooth: $('smoothEdges').checked
      };

      const { result, cellCount, removed, nKept } = generateVoronoi(
        S.positions, S.normals, S.nTri, opts
      );

      S.result = result;

      // Show result
      showResultMesh(result.positions, result.normals, result.nTri);

      // Stats
      $('statsPanel').style.display = '';
      $('statOrigFaces').textContent = S.nTri.toLocaleString();
      $('statResultFaces').textContent = result.nTri.toLocaleString();
      $('statCells').textContent = cellCount;
      $('statRemoved').textContent = removed.toLocaleString() + ` (${Math.round(removed/S.nTri*100)}%)`;
      $('statWalls').textContent = nKept.toLocaleString() + ' × 2';
      $('statRims').textContent = (result.nTri - nKept * 2).toLocaleString();

      $('exportSTLBtn').disabled = false;
      hideProgress();
    } catch (e) {
      setStatus('Error: ' + e.message);
      hideProgress();
    }
    $('generateBtn').disabled = false;
  });
});

// Export
$('exportSTLBtn').addEventListener('click', () => {
  if (!S.result) return;
  const buf = exportSTLBinary(S.result.positions, S.result.normals, S.result.nTri);
  const blob = new Blob([buf], { type: 'application/octet-stream' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const baseName = S.fileName.replace(/\.stl$/i, '');
  a.href = url;
  a.download = `${baseName}_voronoi.stl`;
  a.click();
  URL.revokeObjectURL(url);
  setStatus(`Exported ${a.download}`);
});

// Reset
$('resetBtn').addEventListener('click', () => {
  if (meshResult) { scene.remove(meshResult); meshResult = null; }
  if (wireHelper) { scene.remove(wireHelper); wireHelper = null; }
  S.result = null;
  if (meshOriginal) meshOriginal.visible = true;
  showingOriginal = false;
  $('tbOriginal').classList.remove('active');
  $('exportSTLBtn').disabled = true;
  $('statsPanel').style.display = 'none';
  setStatus('Reset — original model restored');
});

// Toolbar
$('tbFrame').addEventListener('click', () => frameModel(meshResult || meshOriginal));
$('tbWire').addEventListener('click', () => {
  const target = meshResult || meshOriginal;
  if (!target) return;
  if (wireHelper) {
    scene.remove(wireHelper); wireHelper = null;
    $('tbWire').classList.remove('active');
  } else {
    const wg = new THREE.WireframeGeometry(target.geometry);
    wireHelper = new THREE.LineSegments(wg, new THREE.LineBasicMaterial({ color: 0x3ecfff, opacity: 0.3, transparent: true }));
    wireHelper.rotation.copy(target.rotation);
    scene.add(wireHelper);
    $('tbWire').classList.add('active');
  }
});
$('tbSpin').addEventListener('click', () => {
  autoRotate = !autoRotate;
  $('tbSpin').classList.toggle('active', autoRotate);
});
$('tbOriginal').addEventListener('click', () => {
  if (!meshOriginal || !meshResult) return;
  showingOriginal = !showingOriginal;
  meshOriginal.visible = showingOriginal;
  meshResult.visible = !showingOriginal;
  $('tbOriginal').classList.toggle('active', showingOriginal);
  if (wireHelper) { scene.remove(wireHelper); wireHelper = null; $('tbWire').classList.remove('active'); }
});

// Keyboard shortcuts
window.addEventListener('keydown', e => {
  if (e.target.closest?.('input,textarea,select')) return;
  switch (e.key.toLowerCase()) {
    case 'f': $('tbFrame').click(); break;
    case 'w': $('tbWire').click(); break;
    case 't': $('tbSpin').click(); break;
    case 'g': $('generateBtn').click(); break;
    case 'o': $('tbOriginal').click(); break;
  }
});

setStatus('Drop an STL file to begin');
</script>
</body>
</html>
