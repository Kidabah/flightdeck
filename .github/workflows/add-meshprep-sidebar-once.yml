name: Add Mesh Prep to FlightDeck sidebar once
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-meshprep-sidebar-once.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply sidebar patch
        shell: bash
        run: python .github/scripts/add_meshprep_sidebar.py
      - name: Verify
        shell: bash
        run: |
          grep -q 'id="view-meshprep"' app/static/index.html
          grep -q "#/meshprep" app/static/app.js
          grep -q 'tab-meshprep' app/static/app.js
          grep -q 'Mesh Prep sidebar identity' app/static/style.css
          grep -q 'id="clearModelBtn"' makerforge/meshprep.html
      - name: Commit and remove temporary files
        shell: bash
        run: |
          rm .github/workflows/add-meshprep-sidebar-once.yml .github/scripts/add_meshprep_sidebar.py SIDEBAR_INSPECT.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/static/index.html app/static/app.js app/static/style.css makerforge/js/nav.js makerforge/css/makerdeck.css makerforge/index.html .github/workflows/add-meshprep-sidebar-once.yml .github/scripts/add_meshprep_sidebar.py SIDEBAR_INSPECT.txt
          git commit -m 'Add Mesh Prep to FlightDeck sidebar'
          git push origin HEAD:main
