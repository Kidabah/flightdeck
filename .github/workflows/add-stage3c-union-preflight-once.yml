name: Add Stage 3C union preflight once
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-stage3c-union-preflight-once.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply Stage 3C union preflight patch
        run: python .github/scripts/add_stage3c_union_preflight.py
      - name: Verify patch
        run: |
          grep -q 'unionReady' makerforge/js/sanitiser-core.js
          grep -q 'UNION READY' makerforge/meshprep.html
          grep -q 'sanitiser-core.js?v=13' makerforge/meshprep.html
      - name: Commit patch and clean temporary files
        run: |
          rm .github/workflows/add-stage3c-union-preflight-once.yml .github/scripts/add_stage3c_union_preflight.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add makerforge/js/sanitiser-core.js makerforge/meshprep.html .github/workflows/add-stage3c-union-preflight-once.yml .github/scripts/add_stage3c_union_preflight.py
          git commit -m 'Add Stage 3C union preflight'
          git push origin HEAD:main
