name: Fix Mesh Prep repair filename wrap once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fix-meshprep-repair-filename-wrap.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Wrap repair panel filename
        shell: python
        run: |
          from pathlib import Path
          p=Path('makerforge/meshprep.html')
          s=p.read_text(encoding='utf-8')

          css_anchor='.repair-stats .value{color:var(--text);font-weight:700;text-align:right}\n'
          css_new=css_anchor+'.repair-stats .value.file-value{max-width:154px;white-space:normal;overflow-wrap:anywhere;word-break:break-word;line-height:1.25}\n'
          if css_anchor not in s:
              raise SystemExit('repair stats CSS anchor missing')
          s=s.replace(css_anchor,css_new,1)

          old='<span class="label">File</span><span class="value" id="repairFileName">-</span>'
          new='<span class="label">File</span><span class="value file-value" id="repairFileName">-</span>'
          if old not in s:
              raise SystemExit('repair filename row missing')
          s=s.replace(old,new,1)

          p.write_text(s,encoding='utf-8')

      - name: Verify repair filename wrap
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('makerforge/meshprep.html').read_text(encoding='utf-8')
          assert '.repair-stats .value.file-value' in s
          assert 'class="value file-value" id="repairFileName"' in s
          PY

      - name: Commit fix and remove runner
        shell: bash
        run: |
          rm .github/workflows/fix-meshprep-repair-filename-wrap.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add makerforge/meshprep.html .github/workflows/fix-meshprep-repair-filename-wrap.yml
          git commit -m "Wrap Mesh Prep repair panel filename"
          git push origin HEAD:main
