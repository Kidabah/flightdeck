name: Fix MakerDeck deboss inlay once
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/fix-makerdeck-deboss-inlay-once.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch deboss pocket plus colour inlay
        run: |
          python - <<'PY'
          from pathlib import Path
          def replace_once(path, old, new):
              p=Path(path); text=p.read_text(encoding='utf-8'); count=text.count(old)
              if count != 1: raise SystemExit(f'{path}: expected one match, found {count}')
              p.write_text(text.replace(old,new,1),encoding='utf-8')
          p=Path('makerforge/js/app.js'); text=p.read_text(encoding='utf-8')
          old='''  if (state.embossDeboss && params.embossFace !== "lid" && exportCache.debossCutterMesh) {
    const cutterClean = prepareMeshFor3mf(exportCache.debossCutterMesh);
    if (cutterClean?.indices?.length) {
      parts.push({
        name: "Deboss (negative)",
        mesh: cutterClean,
        color: state.boxColor || "#38bdf8",
        extruder: 1,
        subtype: "negative_part",
      });
    }
  }

  return parts;'''
          new='''  if (state.embossDeboss && params.embossFace !== "lid") {
    if (exportCache.debossCutterMesh) {
      const cutterClean = prepareMeshFor3mf(exportCache.debossCutterMesh);
      if (cutterClean?.indices?.length) parts.push({ name: "Deboss pocket (negative)", mesh: cutterClean, color: state.boxColor || "#38bdf8", extruder: 1, subtype: "negative_part" });
    }
    const textInlay = exportCache.labelMesh ? prepareMeshFor3mf(exportCache.labelMesh) : null;
    if (textInlay?.indices?.length) parts.push({ name: "Text inlay", mesh: textInlay, color: state.embossTextColor || "#f8fafc", extruder: extruder++ });
    const artInlay = exportCache.graphicMesh ? prepareMeshFor3mf(exportCache.graphicMesh) : null;
    if (artInlay?.indices?.length) parts.push({ name: "Art inlay", mesh: artInlay, color: state.embossArtColor || "#111827", extruder: extruder++ });
    for (const cp of exportCache.graphicColourParts || []) {
      const cm = cp.mesh ? prepareMeshFor3mf(cp.mesh) : null;
      if (cm?.indices?.length) parts.push({ name: `${cp.name || "Art"} inlay`, mesh: cm, color: cp.color, extruder: extruder++ });
    }
  }

  return parts;'''
          if text.count(old)!=1: raise SystemExit(f'deboss export block matches={text.count(old)}')
          text=text.replace(old,new,1)
          oldp='''  if (state.embossDeboss) {
    const cutter = state.embossFace === "lid"
      ? lidCache?.debossCutterMesh
      : meshCache?.debossCutterMesh;
    if (cutter) {
      const cutterGeom = toBufferGeometry(THREE, cutter);
      attachLabelPreviewMesh(cutterGeom, debossPreviewMaterial, params);
    }
  } else {'''
          newp='''  if (state.embossDeboss) {
    labelMaterial.color.set(state.embossTextColor || "#f8fafc");
    applyFilamentMaterial(labelMaterial);
    const inlay = state.embossFace === "lid" ? lidCache?.labelMesh : meshCache?.labelMesh;
    if (inlay) attachLabelPreviewMesh(toBufferGeometry(THREE, inlay), labelMaterial, params);
  } else {'''
          if text.count(oldp)!=1: raise SystemExit(f'preview block matches={text.count(oldp)}')
          text=text.replace(oldp,newp,1).replace('const MAKERDECK_BUILD = "b624";','const MAKERDECK_BUILD = "b625";',1)
          p.write_text(text,encoding='utf-8')
          replace_once('makerforge/index.html','Red preview shows the subtracting volume. <strong>3MF project</strong> exports it as a native negative part automatically. <em>STL deboss cutter</em> remains available for manual workflows.','<strong>3MF project</strong> exports a shallow negative pocket plus a coloured text/art inlay automatically. The selected art colour is preserved in Bambu; no manual painting is required. <em>STL deboss cutter</em> remains available for manual workflows.')
          replace_once('makerforge/index.html','src="js/app.js?v=624"','src="js/app.js?v=625"')
          PY
      - name: Static checks
        run: |
          node --check makerforge/js/app.js
          grep -q 'MAKERDECK_BUILD = "b625"' makerforge/js/app.js
          grep -q 'name: "Text inlay"' makerforge/js/app.js
          grep -q 'name: "Deboss pocket (negative)"' makerforge/js/app.js
          grep -q 'js/app.js?v=625' makerforge/index.html
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add makerforge/js/app.js makerforge/index.html
          git commit -m "MakerDeck b625: export coloured deboss inlay"
          git push
