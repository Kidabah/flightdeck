name: Apply Mesh Prep boundary support guard once

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/apply-meshprep-boundary-support-guard.yml"

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add conservative boundary support validation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          core_path = Path('makerforge/js/sanitiser-core.js')
          core = core_path.read_text(encoding='utf-8')

          old = "function buildBoundaryDiagnostics(edgeMap, vertexPositions, modelMaxDim) {"
          new = "function buildBoundaryDiagnostics(edgeMap, vertexPositions, modelMaxDim, faceShellIds, shellFaceCounts) {"
          if old not in core:
              raise SystemExit('buildBoundaryDiagnostics signature not found')
          core = core.replace(old, new, 1)

          old = """      const existing = edgeMap.get(edgeKey);\n      if (existing) existing.count++;\n      else edgeMap.set(edgeKey, { count: 1, a: ia, b: ib });"""
          new = """      const existing = edgeMap.get(edgeKey);\n      if (existing) {\n        existing.count++;\n        existing.faces.push(i);\n      } else {\n        edgeMap.set(edgeKey, { count: 1, a: ia, b: ib, faces: [i] });\n      }"""
          if old not in core:
              raise SystemExit('analysis edgeMap block not found')
          core = core.replace(old, new, 1)

          old = """  const visited = new Uint8Array(nTri);\n  let shells = 0;\n\n  for (let start = 0; start < nTri; start++) {\n    if (visited[start]) continue;\n\n    shells++;\n    const stack = [start];\n    visited[start] = 1;\n\n    while (stack.length) {\n      const fi = stack.pop();\n\n      for (const vi of faceVerts[fi]) {\n        for (const nb of vertexFaces[vi]) {\n          if (!visited[nb]) {\n            visited[nb] = 1;\n            stack.push(nb);\n          }\n        }\n      }\n    }\n  }"""
          new = """  const visited = new Uint8Array(nTri);\n  const faceShellIds = new Int32Array(nTri);\n  faceShellIds.fill(-1);\n  const shellFaceCounts = [];\n  let shells = 0;\n\n  for (let start = 0; start < nTri; start++) {\n    if (visited[start]) continue;\n\n    const shellId = shells++;\n    let shellFaceCount = 0;\n    const stack = [start];\n    visited[start] = 1;\n    faceShellIds[start] = shellId;\n\n    while (stack.length) {\n      const fi = stack.pop();\n      shellFaceCount++;\n\n      for (const vi of faceVerts[fi]) {\n        for (const nb of vertexFaces[vi]) {\n          if (!visited[nb]) {\n            visited[nb] = 1;\n            faceShellIds[nb] = shellId;\n            stack.push(nb);\n          }\n        }\n      }\n    }\n\n    shellFaceCounts[shellId] = shellFaceCount;\n  }"""
          if old not in core:
              raise SystemExit('shell traversal block not found')
          core = core.replace(old, new, 1)

          old = """  const boundaryLoops = buildBoundaryDiagnostics(\n    edgeMap,\n    vertexPositions,\n    maxDim\n  );"""
          new = """  const boundaryLoops = buildBoundaryDiagnostics(\n    edgeMap,\n    vertexPositions,\n    maxDim,\n    faceShellIds,\n    shellFaceCounts\n  );"""
          if old not in core:
              raise SystemExit('buildBoundaryDiagnostics call not found')
          core = core.replace(old, new, 1)

          anchor = """    const complex = !closed;\n\n    let perimeter = 0;"""
          insert = """    const complex = !closed;\n\n    const supportingFaces = new Set();\n    for (const edge of componentEdges) {\n      for (const faceId of edge.faces || []) supportingFaces.add(faceId);\n    }\n\n    const supportShellIds = new Set();\n    for (const faceId of supportingFaces) {\n      const shellId = faceShellIds?.[faceId];\n      if (Number.isInteger(shellId) && shellId >= 0) supportShellIds.add(shellId);\n    }\n\n    const supportingFaceCount = supportingFaces.size;\n    const supportShellCount = supportShellIds.size;\n    const supportShellFaceCount = supportShellCount === 1\n      ? (shellFaceCounts?.[[...supportShellIds][0]] || 0)\n      : 0;\n\n    // A simple perimeter is not automatically a hole. An isolated triangle,\n    // sheet patch or tiny standalone shell can also present as a closed 3/4-edge\n    // boundary. Capping those only hides the warning and creates zero-thickness\n    // geometry. Require every boundary edge to be backed by a distinct source\n    // face, all from one surrounding shell, and require that shell to contain\n    // additional geometry beyond the immediate support faces.\n    const simpleCapShape = closed && (componentEdges.length === 3 || componentEdges.length === 4);\n    const enoughDistinctSupport = supportingFaceCount >= componentEdges.length;\n    const oneSupportShell = supportShellCount === 1;\n    const shellHasContext = supportShellFaceCount > supportingFaceCount;\n    const repairEligible = simpleCapShape && enoughDistinctSupport && oneSupportShell && shellHasContext;\n\n    let repairBlockReason = '';\n    if (simpleCapShape && !repairEligible) {\n      if (!enoughDistinctSupport) {\n        repairBlockReason = 'Boundary belongs to an isolated/sheet-like fragment; capping would create zero-thickness geometry.';\n      } else if (!oneSupportShell) {\n        repairBlockReason = 'Boundary is supported by multiple shells; shell joining is outside safe Stage 2 scope.';\n      } else if (!shellHasContext) {\n        repairBlockReason = 'Boundary is the outer perimeter of its support shell, not a proven hole.';\n      }\n    }\n\n    let perimeter = 0;"""
          if anchor not in core:
              raise SystemExit('boundary support insertion anchor not found')
          core = core.replace(anchor, insert, 1)

          old = """      topology: closed ? 'CLOSED_LOOP' : 'BRANCHED_OR_OPEN',\n      classification,\n      recommendation,"""
          new = """      topology: closed ? 'CLOSED_LOOP' : 'BRANCHED_OR_OPEN',\n      classification,\n      recommendation: repairBlockReason || recommendation,\n      supportingFaceCount,\n      supportShellCount,\n      supportShellFaceCount,\n      repairEligible,\n      repairBlockReason,"""
          if old not in core:
              raise SystemExit('boundary loop return block not found')
          core = core.replace(old, new, 1)

          stage2b_anchor = """  if (boundary.edgeCount !== 3 || !Array.isArray(boundary.segments) || boundary.segments.length !== 3) {\n    throw new Error('Stage 2B currently repairs only simple three-edge boundaries.');\n  }\n"""
          stage2b_new = stage2b_anchor + """\n  const freshStage2B = analyseSanitiserMesh(positions, nTri);\n  const stage2BEps = Math.max((freshStage2B.maxDim || 0) * 1e-7, 1e-7);\n  const stage2BSig = boundaryRepairSignature(boundary, stage2BEps);\n  const stage2BFreshBoundary = freshStage2B.boundaryLoops.find(\n    loop => boundaryRepairSignature(loop, stage2BEps) === stage2BSig\n  );\n  if (!stage2BFreshBoundary) {\n    throw new Error('Selected boundary no longer matches the current mesh.');\n  }\n  if (!stage2BFreshBoundary.repairEligible) {\n    throw new Error(stage2BFreshBoundary.repairBlockReason || 'Stage 2B support-context safety check refused this cap.');\n  }\n"""
          if stage2b_anchor not in core:
              raise SystemExit('Stage2B guard anchor not found')
          core = core.replace(stage2b_anchor, stage2b_new, 1)

          stage2c_anchor = """  if (\n    boundary.edgeCount !== 4 ||\n    !Array.isArray(boundary.segments) ||\n    boundary.segments.length !== 4\n  ) {\n    throw new Error('Stage 2C currently repairs only simple four-edge boundaries.');\n  }\n"""
          stage2c_new = stage2c_anchor + """\n  const freshStage2C = analyseSanitiserMesh(positions, nTri);\n  const stage2CEps = Math.max((freshStage2C.maxDim || 0) * 1e-7, 1e-7);\n  const stage2CSig = boundaryRepairSignature(boundary, stage2CEps);\n  const stage2CFreshBoundary = freshStage2C.boundaryLoops.find(\n    loop => boundaryRepairSignature(loop, stage2CEps) === stage2CSig\n  );\n  if (!stage2CFreshBoundary) {\n    throw new Error('Selected boundary no longer matches the current mesh.');\n  }\n  if (!stage2CFreshBoundary.repairEligible) {\n    throw new Error(stage2CFreshBoundary.repairBlockReason || 'Stage 2C support-context safety check refused this cap.');\n  }\n"""
          if stage2c_anchor not in core:
              raise SystemExit('Stage2C guard anchor not found')
          core = core.replace(stage2c_anchor, stage2c_new, 1)

          helper_anchor = "/**\n * Stage 2B selected-boundary repair, first conservative release."
          helper = """function boundaryRepairSignature(boundary, eps) {\n  const pointKey = point =>\n    `${Math.round(point[0] / eps)},${Math.round(point[1] / eps)},${Math.round(point[2] / eps)}`;\n  const segments = (boundary?.segments || []).map(([a, b]) => {\n    const ka = pointKey(a);\n    const kb = pointKey(b);\n    return ka < kb ? `${ka}>${kb}` : `${kb}>${ka}`;\n  }).sort();\n  return `${boundary?.edgeCount || 0}|${segments.join('|')}`;\n}\n\n""" + helper_anchor
          if helper_anchor not in core:
              raise SystemExit('Stage2 helper anchor not found')
          core = core.replace(helper_anchor, helper, 1)

          core_path.write_text(core, encoding='utf-8')

          ui_path = Path('makerforge/meshprep.html')
          ui = ui_path.read_text(encoding='utf-8')

          old = """  const canRepairSelected =\n    loop.closed &&\n    !loop.complex &&\n    loop.topology === 'CLOSED_LOOP' &&\n    (loop.edgeCount === 3 || loop.edgeCount === 4);"""
          new = """  const canRepairSelected =\n    loop.closed &&\n    !loop.complex &&\n    loop.topology === 'CLOSED_LOOP' &&\n    loop.repairEligible === true &&\n    (loop.edgeCount === 3 || loop.edgeCount === 4);"""
          if old not in ui:
              raise SystemExit('UI repair eligibility block not found')
          ui = ui.replace(old, new, 1)

          old = """        Stage 2B repairs simple triangular boundaries. Stage 2C also repairs simple planar convex four-edge boundaries. Complex, concave, twisted, and larger polygonal openings remain inspection-only."""
          new = """        Stage 2B/2C repair only simple 3/4-edge holes with proven surrounding-shell support. Isolated sheets, shell perimeters, multi-shell joins, complex, concave, twisted, and larger openings remain inspection-only."""
          if old not in ui:
              raise SystemExit('UI Stage2 hint not found')
          ui = ui.replace(old, new, 1)

          old = """      `${loop.perimeter.toFixed(1)} mm perimeter` +\n      `<br>${loop.recommendation}` +"""
          new = """      `${loop.perimeter.toFixed(1)} mm perimeter` +\n      `${(loop.edgeCount === 3 || loop.edgeCount === 4) ? (loop.repairEligible ? ' · CAP SAFE' : ' · CAP REFUSED') : ''}` +\n      `<br>${loop.recommendation}` +"""
          if old not in ui:
              raise SystemExit('UI boundary meta block not found')
          ui = ui.replace(old, new, 1)

          # Cache-bust the core module so the Pi/browser cannot keep v5 after pull.
          old = "./js/sanitiser-core.js?v=5"
          new = "./js/sanitiser-core.js?v=6"
          if old not in ui:
              raise SystemExit('sanitiser core cache token not found')
          ui = ui.replace(old, new, 1)

          ui_path.write_text(ui, encoding='utf-8')
          PY

      - name: Run Mesh Prep safety tests
        shell: bash
        run: |
          cp makerforge/js/sanitiser-core.js /tmp/sanitiser-core.mjs
          node --check /tmp/sanitiser-core.mjs
          cat >/tmp/test-boundary-support.mjs <<'JS'
          import {
            analyseSanitiserMesh,
            repairSanitiserBoundaryStage2B,
            repairSanitiserBoundaryStage2C,
          } from 'file:///tmp/sanitiser-core.mjs';

          const mesh = tris => {
            const p = new Float32Array(tris.flat(2));
            return { positions: p, nTri: tris.length };
          };

          // Isolated triangle: looks like a closed 3-edge boundary but is not a hole.
          const isolated = mesh([[[0,0,0],[10,0,0],[0,10,0]]]);
          const ia = analyseSanitiserMesh(isolated.positions, isolated.nTri);
          if (ia.boundaryLoops.length !== 1 || ia.boundaryLoops[0].repairEligible !== false) {
            throw new Error('isolated triangle was incorrectly marked repairable');
          }
          let refused = false;
          try { repairSanitiserBoundaryStage2B(isolated.positions, isolated.nTri, ia.boundaryLoops[0]); }
          catch { refused = true; }
          if (!refused) throw new Error('Stage 2B capped an isolated triangle');

          // Cube missing its top: a genuine four-edge hole with substantial shell context.
          const v = {
            a:[0,0,0], b:[10,0,0], c:[10,10,0], d:[0,10,0],
            e:[0,0,10], f:[10,0,10], g:[10,10,10], h:[0,10,10],
          };
          const cubeOpenTop = mesh([
            [v.a,v.c,v.b],[v.a,v.d,v.c],
            [v.a,v.b,v.f],[v.a,v.f,v.e],
            [v.b,v.c,v.g],[v.b,v.g,v.f],
            [v.c,v.d,v.h],[v.c,v.h,v.g],
            [v.d,v.a,v.e],[v.d,v.e,v.h],
          ]);
          const ca = analyseSanitiserMesh(cubeOpenTop.positions, cubeOpenTop.nTri);
          const quad = ca.boundaryLoops.find(loop => loop.edgeCount === 4);
          if (!quad || quad.repairEligible !== true) {
            throw new Error('genuine cube top hole was not marked repairable');
          }
          const repaired = repairSanitiserBoundaryStage2C(cubeOpenTop.positions, cubeOpenTop.nTri, quad);
          const after = analyseSanitiserMesh(repaired.positions, repaired.nTri);
          if (after.openEdges !== 0 || after.nonManifoldEdges !== 0 || repaired.addedFaces !== 2) {
            throw new Error('Stage 2C genuine-hole repair regression');
          }

          console.log('Mesh Prep boundary support safety tests passed');
          JS
          node /tmp/test-boundary-support.mjs
          git diff --check

      - name: Commit source fix and remove one-time runner
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-meshprep-boundary-support-guard.yml
          git add makerforge/js/sanitiser-core.js makerforge/meshprep.html
          git diff --cached --check
          git commit -m "Guard Mesh Prep boundary caps with shell context"
          git push origin HEAD:main
