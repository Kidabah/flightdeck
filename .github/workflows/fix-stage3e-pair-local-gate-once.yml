name: Fix Stage 3E pair-local gate once
on:
  push:
    paths:
      - '.github/workflows/fix-stage3e-pair-local-gate-once.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python .github/scripts/fix_stage3e_pair_local_gate.py
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add makerforge/meshprep.html
          git diff --cached --quiet && exit 0
          git commit -m 'Use pair-local gate for Stage 3E union'
          git push
