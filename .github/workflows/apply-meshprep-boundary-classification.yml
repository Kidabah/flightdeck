name: Apply Mesh Prep boundary classification once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/apply-meshprep-boundary-classification.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add evidence-based boundary classes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          core_path = Path('makerforge/js/sanitiser-core.js')
          core = core_path.read_text(encoding='utf-8')

          old = """      supportShellFaceCount,\n      repairEligible,\n      repairBlockReason,"""
          new = """      supportShellFaceCount,\n      supportShellIds: [...supportShellIds],\n      repairEligible,\n      repairBlockReason,\n      originalClassification: classification,"""
          if old not in core:
              raise SystemExit('boundary result anchor missing')
          core = core.replace(old, new, 1)

          old = """  const pairs=[...hits.entries()].map(([k,n])=>{const[a,b]=k.split('|').map(Number);return{shellA:a,shellB:b,intersections:n,shellAFaces:shellFaceCounts[a]||0,shellBFaces:shellFaceCounts[b]||0}}).sort((a,b)=>b.intersections-a.intersections);\n  return {shellAabbPairs:shellCandidates.length,intersectingShellPairs:pairs.length,triangleIntersections,testedTrianglePairs,truncated,pairs:pairs.slice(0,100)};"""
          new = """  const pairs=[...hits.entries()].map(([k,n])=>{const[a,b]=k.split('|').map(Number);return{shellA:a,shellB:b,intersections:n,shellAFaces:shellFaceCounts[a]||0,shellBFaces:shellFaceCounts[b]||0}}).sort((a,b)=>b.intersections-a.intersections);\n  const intersectingShellIds = [...new Set(pairs.flatMap(pair => [pair.shellA, pair.shellB]))].sort((a,b)=>a-b);\n  return {shellAabbPairs:shellCandidates.length,intersectingShellPairs:pairs.length,triangleIntersections,testedTrianglePairs,truncated,intersectingShellIds,pairs:pairs.slice(0,100)};"""
          if old not in core:
              raise SystemExit('intersection return anchor missing')
          core = core.replace(old, new, 1)

          old = """  const intersections = analyseShellIntersections(\n    positions, nTri, faceShellIds, shellFaceCounts, maxDim, avgEdge\n  );\n\n  return {"""
          new = """  const intersections = analyseShellIntersections(\n    positions, nTri, faceShellIds, shellFaceCounts, maxDim, avgEdge\n  );\n\n  // Stage 3A evidence feeds back into Stage 2A diagnosis, but never into\n  // repair authorisation. The repairEligible flag remains the only cap gate.\n  const intersectingShellIds = new Set(intersections.intersectingShellIds || []);\n  for (const loop of boundaryLoops) {\n    const supportIds = loop.supportShellIds || [];\n    const touchesProvenIntersection = supportIds.some(id => intersectingShellIds.has(id));\n\n    if (loop.complex || loop.topology !== 'CLOSED_LOOP') {\n      loop.classification = 'COMPLEX';\n      loop.recommendation = 'Boundary is branched or open-chain topology; manual inspection only.';\n      continue;\n    }\n\n    if (touchesProvenIntersection) {\n      loop.classification = 'INTERSECTING SHELL';\n      loop.recommendation = 'This boundary belongs to a shell with proven cross-shell triangle intersections. Resolve the shell overlap before attempting a cap.';\n      continue;\n    }\n\n    if (loop.repairEligible === true) {\n      loop.classification = 'HOLE';\n      loop.recommendation = loop.edgeCount === 3\n        ? 'Proven simple triangular hole with surrounding-shell support; Stage 2B cap is permitted.'\n        : 'Proven simple planar-cap candidate with surrounding-shell support; Stage 2C performs final planarity/convexity checks.';\n      continue;\n    }\n\n    loop.classification = 'SHELL OPENING';\n    loop.recommendation = loop.repairBlockReason ||\n      'Closed boundary is not proven to be a hole. Treat it as an open shell perimeter until reviewed.';\n  }\n\n  return {"""
          if old not in core:
              raise SystemExit('classification insertion anchor missing')
          core = core.replace(old, new, 1)
          core_path.write_text(core, encoding='utf-8')

          ui_path = Path('makerforge/meshprep.html')
          ui = ui_path.read_text(encoding='utf-8')

          old = ".boundary-item[data-class=\"COMPLEX\"] .class{color:var(--red)}"
          new = old + "\n.boundary-item[data-class=\"HOLE\"] .class{color:var(--green)}\n.boundary-item[data-class=\"SHELL OPENING\"] .class{color:#ffbf3f}\n.boundary-item[data-class=\"INTERSECTING SHELL\"] .class{color:#d3a7ff}"
          if old not in ui:
              raise SystemExit('boundary class CSS anchor missing')
          ui = ui.replace(old, new, 1)

          old = "./js/sanitiser-core.js?v=7"
          new = "./js/sanitiser-core.js?v=8"
          if old not in ui:
              raise SystemExit('core cache token missing')
          ui = ui.replace(old, new, 1)
          ui_path.write_text(ui, encoding='utf-8')
          PY
      - name: Syntax and classification tests
        shell: bash
        run: |
          cp makerforge/js/sanitiser-core.js /tmp/sanitiser-core.mjs
          node --check /tmp/sanitiser-core.mjs
          cat >/tmp/test-classification.mjs <<'JS'
          import { analyseSanitiserMesh } from 'file:///tmp/sanitiser-core.mjs';
          const mesh = tris => ({ positions:new Float32Array(tris.flat(2)), nTri:tris.length });

          // A closed cube missing its top has one genuine four-edge hole.
          const cube = mesh([
            [[0,0,0],[10,10,0],[10,0,0]], [[0,0,0],[0,10,0],[10,10,0]],
            [[0,0,0],[10,0,0],[10,0,10]], [[0,0,0],[10,0,10],[0,0,10]],
            [[10,0,0],[10,10,0],[10,10,10]], [[10,0,0],[10,10,10],[10,0,10]],
            [[10,10,0],[0,10,0],[0,10,10]], [[10,10,0],[0,10,10],[10,10,10]],
            [[0,10,0],[0,0,0],[0,0,10]], [[0,10,0],[0,0,10],[0,10,10]]
          ]);
          const a=analyseSanitiserMesh(cube.positions,cube.nTri);
          if(a.boundaryLoops.length!==1 || a.boundaryLoops[0].classification!=='HOLE') throw new Error('missing-top cube not classified HOLE');

          // An isolated triangle is an opening/perimeter, never a hole.
          const sheet=mesh([[[0,0,0],[10,0,0],[0,10,0]]]);
          const b=analyseSanitiserMesh(sheet.positions,sheet.nTri);
          if(b.boundaryLoops.length!==1 || b.boundaryLoops[0].classification!=='SHELL OPENING') throw new Error('isolated sheet not classified SHELL OPENING');
          JS
          node /tmp/test-classification.mjs
      - name: Commit source fix and remove runner
        shell: bash
        run: |
          rm .github/workflows/apply-meshprep-boundary-classification.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add makerforge/js/sanitiser-core.js makerforge/meshprep.html .github/workflows/apply-meshprep-boundary-classification.yml
          git commit -m "Classify Mesh Prep boundaries with shell evidence"
          git push origin HEAD:main
