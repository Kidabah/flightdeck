name: Fix Stage 3C truncated intersection gate once

on:
  push:
    branches: [main]
    paths:
      - ".github/scripts/fix_stage3c_truncated_gate.py"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply Stage 3C gate fix
        run: python .github/scripts/fix_stage3c_truncated_gate.py
      - name: Verify
        run: |
          grep -q '!beforeIx.truncated && !afterIx.truncated' makerforge/meshprep.html
          grep -q 'sanitiser-core.js?v=11' makerforge/meshprep.html
      - name: Commit fix and remove temporary files
        run: |
          rm .github/scripts/fix_stage3c_truncated_gate.py
          rm .github/workflows/fix-stage3c-truncated-intersection-gate.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add makerforge/meshprep.html .github/scripts/fix_stage3c_truncated_gate.py .github/workflows/fix-stage3c-truncated-intersection-gate.yml
          git commit -m "Fix Stage 3C truncated intersection safety gate"
          git push origin HEAD:main
