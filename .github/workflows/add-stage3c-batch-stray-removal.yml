name: Add Mesh Prep Stage 3C batch stray removal once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/add-stage3c-batch-stray-removal.yml"
      - ".github/scripts/patch_stage3c_batch.py"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply Stage 3C batch patch
        run: python .github/scripts/patch_stage3c_batch.py
      - name: Verify
        run: |
          grep -q "repairSanitiserIntersectionStage3CBatch" makerforge/js/sanitiser-core.js
          grep -q "REMOVE ALL SAFE STRAY FRAGMENTS" makerforge/meshprep.html
          grep -q "sanitiser-core.js?v=12" makerforge/meshprep.html
      - name: Commit source change and remove temporary files
        run: |
          rm .github/workflows/add-stage3c-batch-stray-removal.yml .github/scripts/patch_stage3c_batch.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add makerforge/js/sanitiser-core.js makerforge/meshprep.html .github/workflows/add-stage3c-batch-stray-removal.yml .github/scripts/patch_stage3c_batch.py
          git commit -m "Add Mesh Prep Stage 3C batch stray removal"
          git push origin HEAD:main
