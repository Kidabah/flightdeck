name: Fix PrintShelf mount guard once

on:
  push:
    paths:
      - '.github/workflows/fix-printshelf-mount-guard-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch
        run: python .github/scripts/fix_printshelf_mount_guard.py
      - name: Validate Python
        run: python -m py_compile printshelf/app/scanner.py
      - name: Validate guards
        run: |
          grep -q '/proc/self/mountinfo' printshelf/app/scanner.py
          grep -q '_has_real_mount_ancestor' printshelf/app/scanner.py
          grep -q 'not_readable' printshelf/app/scanner.py
          grep -q 'PrintShelf mount readiness fix' SESSION_NEXT.md
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add printshelf/app/scanner.py SESSION_NEXT.md
          git diff --cached --check
          git commit -m 'Fix PrintShelf bind mount detection'
          git push origin HEAD:main
