name: Add Stage 3D shell closure once
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-stage3d-shell-closure-once.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply Stage 3D patch
        run: python .github/scripts/add_stage3d_shell_closure.py
      - name: Verify Stage 3D symbols
        run: |
          grep -q 'analyseSanitiserIntersectionStage3D' makerforge/js/sanitiser-core.js
          grep -q 'repairSanitiserIntersectionStage3D' makerforge/js/sanitiser-core.js
          grep -q 'PREPARE SHELLS' makerforge/meshprep.html
          grep -q 'PRE-UNION REPAIR AVAILABLE' makerforge/meshprep.html
      - name: Commit Stage 3D and remove temporary files
        run: |
          rm .github/workflows/add-stage3d-shell-closure-once.yml .github/scripts/add_stage3d_shell_closure.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add makerforge/js/sanitiser-core.js makerforge/meshprep.html .github/workflows/add-stage3d-shell-closure-once.yml .github/scripts/add_stage3d_shell_closure.py
          git commit -m 'Add Stage 3D shell-local closure'
          git push origin HEAD:main
