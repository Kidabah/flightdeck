name: Promote Mesh Prep and add clear model once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/promote-meshprep-clear-model.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply Mesh Prep UX patch
        shell: bash
        run: python .github/scripts/promote_meshprep_clear.py

      - name: Verify Mesh Prep UX source
        shell: bash
        run: |
          grep -q "id: 'meshprep'" makerforge/js/nav.js
          grep -q "md-nav-link--meshprep" makerforge/js/nav.js
          grep -q "Mesh Prep has its own violet identity" makerforge/css/makerdeck.css
          grep -q "Mesh Prep</a>" makerforge/index.html
          grep -q 'id="clearModelBtn"' makerforge/meshprep.html
          grep -q 'function clearMeshPrepModel()' makerforge/meshprep.html
          grep -q "nav.js?v=552" makerforge/meshprep.html

      - name: Commit changes and remove temporary files
        shell: bash
        run: |
          rm .github/workflows/promote-meshprep-clear-model.yml .github/scripts/promote_meshprep_clear.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add makerforge/js/nav.js makerforge/css/makerdeck.css makerforge/index.html makerforge/meshprep.html .github/workflows/promote-meshprep-clear-model.yml .github/scripts/promote_meshprep_clear.py
          git commit -m "Promote Mesh Prep and add clear model command"
          git push origin HEAD:main
