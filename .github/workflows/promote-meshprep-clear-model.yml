name: Promote Mesh Prep and add clear model once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/promote-meshprep-clear-model.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply Mesh Prep UX patch
        shell: bash
        run: python .github/scripts/promote_meshprep_clear.py

      - name: Verify Mesh Prep UX source
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          nav=Path('makerforge/js/nav.js').read_text(encoding='utf-8')
          css=Path('makerforge/css/makerdeck.css').read_text(encoding='utf-8')
          idx=Path('makerforge/index.html').read_text(encoding='utf-8')
          h=Path('makerforge/meshprep.html').read_text(encoding='utf-8')
          assert nav.index("id: 'meshprep'") < nav.index("id: 'painter'")
          assert 'md-nav-link--meshprep' in nav
          assert '.md-nav-link--meshprep' in css
          assert '◆ Mesh Prep' in idx
          assert 'id="clearModelBtn"' in h
          assert 'function clearMeshPrepModel()' in h
          assert "$('clearModelBtn').addEventListener('click', clearMeshPrepModel);" in h
          assert "import './js/nav.js?v=552';" in h
          PY

      - name: Commit changes and remove temporary files
        shell: bash
        run: |
          rm .github/workflows/promote-meshprep-clear-model.yml .github/scripts/promote_meshprep_clear.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add makerforge/js/nav.js makerforge/css/makerdeck.css makerforge/index.html makerforge/meshprep.html .github/workflows/promote-meshprep-clear-model.yml .github/scripts/promote_meshprep_clear.py
          git commit -m "Promote Mesh Prep and add clear model command"
          git push origin HEAD:main
