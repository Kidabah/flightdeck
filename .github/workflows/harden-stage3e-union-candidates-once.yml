name: Harden Stage 3E union candidates once
on:
  push:
    paths:
      - '.github/workflows/harden-stage3e-union-candidates-once.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python .github/scripts/harden_stage3e_union_candidates.py
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add makerforge/meshprep.html
          git commit -m 'Harden Stage 3E union candidates'
          git push
