name: Move Mesh Prep intersection panel once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/move-meshprep-intersection-panel.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reposition and verify Stage 3A panel
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('makerforge/meshprep.html')
          s = p.read_text(encoding='utf-8')
          start = s.index('    <div id="intersectionPanel" class="intersection-panel" hidden>')
          end = s.index('    <div id="boundaryRepairComplete"', start)
          block = s[start:end]
          if block.count('id="intersectionPanel"') != 1:
              raise SystemExit('intersection panel block mismatch')
          s = s[:start] + s[end:]
          marker = '    <div id="boundaryPanel" class="boundary-panel" hidden>'
          if marker not in s:
              raise SystemExit('boundary panel marker missing')
          s = s.replace(marker, block + marker, 1)
          if not (s.index('id="repairPanel"') < s.index('id="intersectionPanel"') < s.index('id="boundaryPanel"')):
              raise SystemExit('panel order verification failed')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit change and remove runner
        shell: bash
        run: |
          rm .github/workflows/move-meshprep-intersection-panel.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add makerforge/meshprep.html .github/workflows/move-meshprep-intersection-panel.yml
          git commit -m "Move Mesh Prep intersection inspector below repair panel"
          git push origin HEAD:main
