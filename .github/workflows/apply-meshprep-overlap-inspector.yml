name: Apply Mesh Prep overlap inspector once

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/apply-meshprep-overlap-inspector.yml"

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply Stage 3 patch
        run: python scripts/patch_meshprep_stage3.py
      - name: Syntax check
        run: |
          cp makerforge/js/sanitiser-core.js /tmp/sanitiser-core.mjs
          node --check /tmp/sanitiser-core.mjs
      - name: Commit source change and remove temporary files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-meshprep-overlap-inspector.yml scripts/patch_meshprep_stage3.py
          git add makerforge/js/sanitiser-core.js makerforge/meshprep.html
          git diff --cached --check
          git commit -m "Add Mesh Prep Stage 3A shell intersection inspector"
          git push origin HEAD:main
