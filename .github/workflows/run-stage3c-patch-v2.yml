name: Run Mesh Prep Stage 3C patch v2

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/run-stage3c-patch-v2.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply Stage 3C patch
        run: python .github/scripts/patch_meshprep_stage3c.py
      - name: Verify
        run: |
          grep -q "repairSanitiserIntersectionStage3C" makerforge/js/sanitiser-core.js
          grep -q "REMOVE STRAY FRAGMENT" makerforge/meshprep.html
          grep -q "sanitiser-core.js?v=10" makerforge/meshprep.html
      - name: Commit source and remove temporary patch files
        run: |
          rm -f .github/workflows/apply-meshprep-stage3c-fragments.yml
          rm -f .github/workflows/run-stage3c-patch-v2.yml
          rm -f .github/scripts/patch_meshprep_stage3c.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add makerforge/js/sanitiser-core.js makerforge/meshprep.html .github/workflows .github/scripts
          git commit -m "Add safe Mesh Prep Stage 3C fragment repair"
          git push origin HEAD:main
