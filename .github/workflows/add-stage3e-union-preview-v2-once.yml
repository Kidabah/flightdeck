name: Add Stage 3E union preview v2 once
on:
  push:
    paths:
      - '.github/workflows/add-stage3e-union-preview-v2-once.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python .github/scripts/add_stage3e_union_preview_v2.py
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add makerforge/meshprep.html
          git diff --cached --quiet && exit 0
          git commit -m 'Add Stage 3E transactional union preview'
          git push
