<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cindy · Vinyl</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css?v=18">
</head>
<body>
  <div class="lamp" aria-hidden="true"></div>
  <div class="grain" aria-hidden="true"></div>

  <header class="top">
    <div class="brand">
      <span class="brand-mark">Cindy</span>
      <span class="brand-sub">vinyl room</span>
    </div>
    <form class="search" id="searchForm" autocomplete="off">
      <input id="searchInput" type="search" placeholder="Search the crates…" enterkeyhint="search">
    </form>
  </header>

  <main class="stage" id="stage">
    <section class="hero" id="hero">
      <div class="deck-stage" id="deckStage">
        <img class="deck-photo" src="/static/deck.png" alt="Technics SL-1200 Limited">
        <div class="platter-live" id="vinyl" aria-hidden="true">
          <div class="label" id="vinylLabel">
            <img id="vinylArt" alt="" hidden>
            <span id="vinylFallback">C</span>
          </div>
        </div>
        <div class="arm-park-cover" id="armParkCover" aria-hidden="true"></div>
        <div class="tonearm-rig" id="tonearm" aria-hidden="true">
          <svg class="tonearm-svg" viewBox="0 0 240 200" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <linearGradient id="goldArm" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#f0d78c"/>
                <stop offset="45%" stop-color="#d4af37"/>
                <stop offset="100%" stop-color="#8a7020"/>
              </linearGradient>
            </defs>
            <!-- pivot / base -->
            <circle cx="188" cy="62" r="16" fill="url(#goldArm)" stroke="#5c4a18" stroke-width="1.2"/>
            <circle cx="188" cy="62" r="7" fill="#1a1408" stroke="#c4a050" stroke-width="1"/>
            <!-- counterweight -->
            <rect x="200" y="52" width="28" height="14" rx="3" fill="url(#goldArm)" stroke="#5c4a18" stroke-width="1" transform="rotate(18 188 62)"/>
            <!-- S-arm -->
            <path d="M178 68
                     C155 95, 140 118, 118 128
                     C95 138, 72 132, 52 118
                     C40 110, 32 100, 28 92"
                  fill="none" stroke="url(#goldArm)" stroke-width="5.5" stroke-linecap="round"/>
            <!-- headshell -->
            <g transform="translate(22,86) rotate(-28)">
              <rect x="0" y="0" width="22" height="10" rx="1.5" fill="#151515" stroke="#c4a050" stroke-width="1"/>
              <rect x="16" y="2" width="10" height="6" rx="1" fill="url(#goldArm)"/>
              <!-- stylus -->
              <path d="M2 10 L5 18 L8 10" fill="none" stroke="#d4af37" stroke-width="1.4" stroke-linecap="round"/>
            </g>
          </svg>
        </div>
      </div>
      <div class="hero-copy">
        <p class="deck-tag">Technics SL-1200 Limited</p>
        <h1 id="nowTitle">Drop the needle</h1>
        <p id="nowArtist">5.4TB on Cindy — CHECKED · MUSIC · JAMAL</p>
        <div class="hero-actions">
          <button type="button" class="spin-btn" id="spinBtn">SPIN</button>
          <button type="button" class="ghost-btn" id="playPauseBtn" disabled>Play</button>
        </div>
        <p class="hint" id="statusLine">Warming up the tubes…</p>
      </div>
    </section>

    <section class="crates" id="cratesSection">
      <div class="crates-head">
        <h2>Crates</h2>
        <div class="crate-tabs" role="tablist">
          <button type="button" class="crate-tab active" data-type="newest">Fresh sleeves</button>
          <button type="button" class="crate-tab" data-type="random">Shuffle bin</button>
          <button type="button" class="crate-tab" data-type="frequent">Often spun</button>
        </div>
      </div>
      <div class="crate-rail" id="crateRail" tabindex="0"></div>
    </section>

    <section class="queue-strip" id="queueStrip" hidden>
      <h2>On deck</h2>
      <ol id="queueList"></ol>
    </section>

    <section class="search-results" id="searchResults" hidden>
      <h2>Found in the stacks</h2>
      <div id="searchGrid"></div>
    </section>
  </main>

  <footer class="transport">
    <div class="deck-art"><img id="deckArt" alt=""></div>
    <div class="deck-meta">
      <div id="deckTitle">—</div>
      <div id="deckArtist">—</div>
      <input type="range" id="seek" min="0" max="1000" value="0" aria-label="Seek">
    </div>
    <div class="deck-controls">
      <button type="button" id="prevBtn" aria-label="Previous">⏮</button>
      <button type="button" id="deckPlay" aria-label="Play/Pause">▶</button>
      <button type="button" id="nextBtn" aria-label="Next">⏭</button>
    </div>
  </footer>

  <audio id="audio" preload="none"></audio>
  <script src="/static/app.js?v=18"></script>
</body>
</html>
