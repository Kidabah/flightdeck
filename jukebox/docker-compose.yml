services:
  navidrome:
    image: deluan/navidrome:latest
    container_name: cindy-navidrome
    restart: unless-stopped
    user: "1004:1004"
    ports:
      - "4533:4533"
    environment:
      ND_SCANSCHEDULE: "1h"
      ND_LOGLEVEL: info
      ND_SESSIONTIMEOUT: "24h"
      ND_BASEURL: ""
      ND_PORT: "4533"
      ND_MUSICFOLDER: /music
      ND_DATAFOLDER: /data
      ND_ENABLESHARING: "false"
      ND_DEFAULTTHEME: Dark
      ND_ENABLEFAVOURITES: "true"
      ND_ENABLESTARRATING: "true"
      # Ignore obvious non-audio junk under CHECKED/JAMAL
      ND_IGNOREFILERULES: "(\\.tmp|\\.part|/\\.|Thumbs\\.db|desktop\\.ini|\\.DS_Store|#recycle|/\\.Trash)"
    volumes:
      - /mnt/cindy:/music:ro
      - /home/flightdeck/cindy-navidrome/data:/data
    # Host network not required; port publish is enough for Tailscale

  vinyl:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cindy-vinyl
    restart: unless-stopped
    ports:
      - "4540:4540"
    environment:
      NAVIDROME_URL: http://navidrome:4533
      JUKEBOX_USER: ${JUKEBOX_USER:-jukebox}
      JUKEBOX_PASSWORD: ${JUKEBOX_PASSWORD:?set JUKEBOX_PASSWORD in .env}
      JUKEBOX_HOST: 0.0.0.0
      JUKEBOX_PORT: "4540"
    depends_on:
      - navidrome
